name: Gold policy diagnostics (read only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/gold_policy_diagnostics.py'
      - '.github/workflows/gold-policy-diagnostics.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # This job only GETs immutable objects: it never joins or cancels data writers.
    env:
      R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
      R2_BUCKET: arabsniper-gold
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing private storage client
        run: pip install boto3
      - name: Read published schedule and explain policy exclusions
        run: python src/gold_policy_diagnostics.py
