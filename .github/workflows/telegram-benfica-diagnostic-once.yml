name: Benfica Gold Over 1.5 PT one-time diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/telegram-benfica-diagnostic-once.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install boto3
      - name: Inspect only Gold market decision for Benfica-Alverca
        env:
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          PYTHONPATH=src python3 - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from gold_storage import client
          from opportunity_policy import goal_market
          now=datetime.now(ZoneInfo("Europe/Rome"))
          body=client().get_object(Bucket='arabsniper-gold',Key='arab_quote_day1.json')['Body'].read()
          day=json.loads(body)
          print('DAY',day.get('date'),'UPDATED',day.get('updated_at'))
          matches=[m for m in day.get('matches',[]) if 'benfica' in (m.get('fixture') or {}).get('match','').lower() and 'alverca' in (m.get('fixture') or {}).get('match','').lower()]
          print('BENFICA_FOUND',len(matches))
          for m in matches:
              fixture=m.get('fixture') or {}; analysis=m.get('multimarket') or {}
              matrix=analysis.get('matrix') or {}; gold=matrix.get('opportunity_policy') or {}
              print('FIXTURE',fixture.get('fixture_id'),fixture.get('kickoff'),fixture.get('status_short'))
              print('GOLD_BEST',gold.get('best_market_id'),'CAPTURED',analysis.get('captured_at'))
              for r in matrix.get('rows',[]):
                  if goal_market(r)=='over15_ht':
                      decision=r.get('opportunity') or {}
                      print('OVER15_HT',json.dumps(dict(id=r.get('id'),eligible=decision.get('eligible'),
                           strict=decision.get('strict_eligible'),signal=decision.get('signal'),
                           reasons=decision.get('reasons'),odd=r.get('odd'),
                           quote_status=r.get('quote_status'),quote_executable=r.get('quote_executable'),
                           provider_updated_at=r.get('provider_updated_at'),
                           oci=r.get('oci'),platinum=(r.get('platinum') or {}).get('eligible')),ensure_ascii=False))
          PY
