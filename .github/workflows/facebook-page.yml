name: Facebook Page publication
on:
  push:
    branches: [main]
    paths: ['.github/workflows/facebook-page.yml', 'src/facebook_page.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: facebook-page-publication
  cancel-in-progress: false
jobs:
  publish:
    # Retired by Publisher V7.1. Restore via the documented rollback.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install Pillow==11.3.0 requests==2.32.5
      - name: Recover the latest confirmed Telegram slot on manual check
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          prefix="tg-$(TZ=Europe/Rome date +%F)-"
          item=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" | jq -r --arg prefix "$prefix" '[.artifacts[] | select(.expired == false and (.name|startswith($prefix)) and (.name|endswith("-sent")))] | sort_by(.created_at) | last | select(.!=null) | [.workflow_run.id,.name] | @tsv')
          if [ -n "$item" ]; then
            read -r run_id artifact_name <<< "$item"
            gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n "$artifact_name" -D receipts
          fi
      - name: Check Page identity or publish eligible content
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || [ "$EVENT" = push ]; then
            PYTHONPATH=src python -c 'from facebook_page import graph, PAGE; assert graph("me?fields=id")["id"] == PAGE; assert "data" in graph(PAGE + "/published_posts?fields=id&limit=1"); print("Page identity and published-post access verified")'
            python src/facebook_page.py selections
          elif [ "$EVENT" = schedule ]; then
            python src/facebook_page.py results
          else
            python src/facebook_page.py selections
          fi
