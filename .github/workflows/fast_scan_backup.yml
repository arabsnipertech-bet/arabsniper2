name: ArabSniper Fast Backup

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Controlla senza avviare un Fast Scan'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: arabsniper-fast-backup
  cancel-in-progress: false

jobs:
  check-and-wake:
    if: github.repository == 'arabsnipertech-bet/arabsniper2' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONPATH: src
      R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
      R2_BUCKET: arabsniper-gold
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recover nightly Auditor within protected windows
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUDITOR_BACKUP_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: python3 src/auditor_backup_dispatch.py
      - name: Check publication and wake a due Fast
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FAST_BACKUP_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: python3 src/fast_backup_dispatch.py
      - name: Prepare Publisher watchdog and home projection
        if: always()
        run: python3 -m pip install 'boto3>=1.42,<2' 'requests>=2.32,<3' 'Pillow>=11,<13' 'PyNaCl>=1.5,<2' ijson==3.6.0
      - name: Recover the Publisher workflow in the owning repository
        id: editorial
        if: always() && !cancelled()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISHER_GROWTH_DISPATCH_TOKEN: ${{ secrets.PUBLISHER_GROWTH_DISPATCH_TOKEN }}
          FAST_BACKUP_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: python -m publisher_v71.bridge
      - name: Wake the Growth Gold results workflow when due
        if: always() && !cancelled()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISHER_GROWTH_DISPATCH_TOKEN: ${{ secrets.PUBLISHER_GROWTH_DISPATCH_TOKEN }}
          FAST_BACKUP_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: python -m publisher_v71.bridge --gold-results
      # Until November 18 the existing campaign uses its D1 receipts and a separate fallback schedule.
      - name: Recover due Telegram campaign reminders
        if: always() && !cancelled() && !inputs.dry_run && steps.editorial.outputs.owner == 'arabsnipertech-bet/arabsniper-growth' && vars.PUBLISHER_V71_TRIAL_DISABLED != 'true'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_STRIPE_WORKER_API_TOKEN }}
          D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: python scripts/gold-campaign-repeat.py
      - name: Recover due Facebook campaign reminders
        if: always() && !cancelled() && !inputs.dry_run && steps.editorial.outputs.owner == 'arabsnipertech-bet/arabsniper-growth' && vars.PUBLISHER_V71_TRIAL_DISABLED != 'true' && vars.PUBLISHER_V71_FACEBOOK_DISABLED != 'true'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          META_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_STRIPE_WORKER_API_TOKEN }}
          D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: python scripts/gold-campaign-facebook.py
