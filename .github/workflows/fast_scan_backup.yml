name: ArabSniper Fast Backup

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Controlla senza avviare un Fast Scan'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: arabsniper-fast-backup
  cancel-in-progress: false

jobs:
  check-and-wake:
    if: github.repository == 'arabsnipertech-bet/arabsniper2' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONPATH: src
      R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
      R2_BUCKET: arabsniper-gold
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recover nightly Auditor within protected windows
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUDITOR_BACKUP_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: python3 src/auditor_backup_dispatch.py
      - name: Check publication and wake a due Fast
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FAST_BACKUP_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: python3 src/fast_backup_dispatch.py
      - name: Prepare Publisher watchdog and home projection
        if: always()
        run: pip install 'boto3>=1.42,<2' 'requests>=2.32,<3' 'Pillow>=11,<13' ijson==3.6.0
      - name: Recover the Publisher workflow in the owning repository
        if: always() && !cancelled()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISHER_GROWTH_DISPATCH_TOKEN: ${{ secrets.PUBLISHER_GROWTH_DISPATCH_TOKEN }}
          FAST_BACKUP_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: python -m publisher_v71.bridge
