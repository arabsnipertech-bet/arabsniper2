name: ArabSniper Fast Backup

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Controlla senza avviare un Fast Scan'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: arabsniper-fast-backup
  cancel-in-progress: false

jobs:
  check-and-wake:
    if: github.repository == 'arabsnipertech-bet/arabsniper2' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Check publication and wake a due Fast
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FAST_BACKUP_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: python3 src/fast_backup_dispatch.py
      - name: Recover missing Telegram publication windows
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FAST_BACKUP_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: python3 src/telegram_watchdog.py
      - name: Wake or recover the daily Telegram live
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FAST_BACKUP_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: python3 src/telegram_live.py dispatch
