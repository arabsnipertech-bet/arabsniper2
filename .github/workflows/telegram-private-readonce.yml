name: Telegram private Platinum read-only verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/telegram-private-readonce.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install boto3
      - name: Verify private R2 Gold and Platinum inputs without Telegram publication
        env:
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          PYTHONPATH=src python3 - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from telegram_private_feed import fetch_current_private
          now=datetime.now(ZoneInfo('Europe/Rome'))
          picks=fetch_current_private(now)
          print('private R2 feed accessible; eligible total',len(picks),
                'platinum',sum(p['source_tier']=='platinum' for p in picks),
                'gold',sum(p['source_tier']=='gold' for p in picks))
          # A valid empty feed is allowed; absence and invalid input throw.
          assert all(x['market'] in ('over15_ht','over25_ht','gg_ht','over25_ft','over35_ft') for x in picks)
          PY

# Verify current private board size after reader fix
