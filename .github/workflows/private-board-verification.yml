name: Private board verification
on:
  push:
    branches: ['check/telegram-gold-20261104']
    paths: ['.github/workflows/private-board-verification.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: pip install boto3
      - name: Read board and return encrypted summary
        env:
          PYTHONPATH: src
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -eu
          cat > cert.pem <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIDATCCAemgAwIBAgIUeJ+ZraCYt20O7hnxgWlkdYELJoMwDQYJKoZIhvcNAQEL
          BQAwEDEOMAwGA1UEAwwFY2hlY2swHhcNMjYxMTA0MTIxODM5WhcNMjYxMTA1MTIx
          ODM5WjAQMQ4wDAYDVQQDDAVjaGVjazCCASIwDQYJKoZIhvcNAQEBBQADggEPADCC
