name: Publish Growth home projection
on:
  workflow_dispatch:
    inputs:
      prepare:
        description: Verifica il collegamento a Growth e prepara l'accesso al registro
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['.github/workflows/publisher-home-bridge.yml']
permissions:
  contents: write
concurrency:
  group: publisher-home-bridge
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'arabsnipertech-bet/arabsniper2' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: src
      - run: pip install 'boto3>=1.42,<2' 'requests>=2.32,<3' 'Pillow>=11,<13' ijson==3.6.0
      - name: Publish the verified public projection
        env:
          PYTHONPATH: src
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PUBLISHER_GROWTH_DISPATCH_TOKEN: ${{ secrets.PUBLISHER_GROWTH_DISPATCH_TOKEN }}
          PREPARE: ${{ github.event_name == 'push' || inputs.prepare }}
        run: |
          if [[ "$PREPARE" == true ]]; then
            python -m publisher_v71.bridge --prepare
          else
            python -m publisher_v71.bridge --homepage
          fi
