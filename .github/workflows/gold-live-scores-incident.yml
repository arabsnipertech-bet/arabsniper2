name: Gold live scores incident diagnostics
on:
  push:
    branches: [ops/gold-results-audit-20261113]
    paths: [.github/workflows/gold-live-scores-incident.yml]
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'arabsnipertech-bet/arabsniper2' && github.ref == 'refs/heads/ops/gold-results-audit-20261113'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            src
            web
      - run: pip install 'boto3>=1.42,<2' cryptography ijson==3.6.0 requests
      - name: Read live Worker and official fixtures
        env:
          CF_DEDICATED: ${{ secrets.CLOUDFLARE_LIVE_SCORES_API_TOKEN }}
          CF_GENERAL: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_WORKERS: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CF_STRIPE: ${{ secrets.CLOUDFLARE_STRIPE_WORKER_API_TOKEN }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_LIVE_SCORES_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_STRIPE_WORKER_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
        shell: python
        run: |
          import base64, email.parser, email.policy, hashlib, json, os, subprocess, tempfile
          from datetime import datetime, timezone
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import build_opener, HTTPRedirectHandler, Request

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args):
                  return None

          def get(url, headers=None):
              try:
                  with build_opener(NoRedirect()).open(Request(url, headers=headers or {}), timeout=18) as r:
                      return r.status, r.headers, r.read()
              except HTTPError as exc:
                  return exc.code, exc.headers, exc.read()
              except (URLError, TimeoutError):
                  return 0, {}, b''

          def decode(data):
              try:
                  return json.loads(data)
              except (ValueError, UnicodeError):
                  return {}

          def show(name, data):
              print(name, json.dumps(data, sort_keys=True), flush=True)

          cf = 'https://api.cloudflare.com/client/v4'
          acct = cf + '/accounts/dfdb02b4139b31c0ab4456a50eb371a2'
          worker = '/workers/scripts/arabsniper-live-scores'
          token = os.environ.get('CF_TOKEN')
          for name in ('CF_DEDICATED', 'CF_GENERAL', 'CF_WORKERS', 'CF_STRIPE'):
              value = os.environ.get(name)
              if not value:
                  show('cloudflare_credential', {'name': name, 'present': False})
                  continue
              code, _, data = get(acct + worker + '/deployments', {'Authorization':'Bearer ' + value})
              show('cloudflare_credential', {'name': name, 'http': code, 'authorized': decode(data).get('success') is True})
              if code == 200 and decode(data).get('success') is True:
                  token = value
          
          if token:
              headers = {'Authorization': 'Bearer ' + token}
              for part in ('/settings', '/schedules', '/deployments', '/content/v2'):
                  code, meta, data = get(acct + worker + part, headers)
                  payload = decode(data) if part != '/content/v2' or code != 200 else {}
                  result = payload.get('result') or {}
                  safe = {'http': code, 'errors': [e.get('code') for e in payload.get('errors', [])]}
                  if code == 200:
                      if part == '/settings':
                          bindings = {b['name']: b for b in result.get('bindings', [])}
                          safe.update(compatibility_date=result.get('compatibility_date'),
                                      scores_binding={k: bindings.get('SCORES', {}).get(k) for k in ('type', 'class_name')},
                                      api_secret_type=bindings.get('API_SPORTS_KEY', {}).get('type'),
                                      live_enabled=bindings.get('LIVE_ENABLED', {}).get('text') == 'true',
                                      budget={k: str(bindings.get(k, {}).get('text', '')) if str(bindings.get(k, {}).get('text', '')).isdigit() else None for k in ('MAX_CALLS_PER_DAY', 'RESERVE_REQUESTS')})
                      if part == '/schedules':
                          schedules = result if isinstance(result, list) else result.get('schedules', [])
                          safe['cron'] = [s.get('cron') for s in schedules]
                      if part == '/deployments':
                          safe['deployments'] = [{k: d.get(k) for k in ('id', 'created_on', 'source', 'versions')}
                                                 for d in result.get('deployments', [])[:3]]
                      if part == '/content/v2':
                          content_type = meta.get('Content-Type', '')
                          modules = [data]
                          if 'multipart/' in content_type:
                              message = email.parser.BytesParser(policy=email.policy.default).parsebytes(
                                  ('Content-Type: ' + content_type + '\r\n\r\n').encode() + data)
                              modules = [p.get_payload(decode=True) for p in message.iter_parts()]
                          safe['modules'] = [{'sha256': hashlib.sha256(m).hexdigest(), 'bytes': len(m),
                                              'exact_id_recovery': b'fixtures?id=' in m,
                                              'live_score_collector': b'scores.internal/refresh' in m} for m in modules if m]
                  show('cloudflare' + part, safe)
              code, _, data = get(cf + '/zones?name=arabsniperbet.com', headers)
              zones = decode(data).get('result') or []
              if code == 200 and len(zones) == 1:
                  code, _, data = get(cf + '/zones/' + zones[0]['id'] + '/workers/routes', headers)
                  routes = decode(data).get('result') or []
                  show('cloudflare/routes', {'http': code, 'expected_route': any(
                      r.get('pattern') == 'arabsniperbet.com/api/live-scores*' and r.get('script') == 'arabsniper-live-scores' for r in routes)})
              else:
                  show('cloudflare/routes', {'zones_http': code})
          else:
              show('cloudflare', {'credential_configured': False})

          ids = {'1644690', '1649517'}
          observed = datetime.now(timezone.utc)
          attempt = subprocess.run(['curl', '-sS', '--max-time', '18', '-H', 'Accept: application/json', '-w', '\n%{http_code}', 'https://arabsniperbet.com/api/live-scores'], capture_output=True)
          body, _, status = attempt.stdout.rpartition(b'\n')
          status = int(status) if status.isdigit() else 0
          live = decode(body)
          scores = live.get('fixtures') or {}
          show('public_worker', {'http': status, 'checked_at': observed.isoformat(),
                                'generated_at': live.get('generated_at'), 'status': live.get('status'),
                                'diagnostic': live.get('diagnostic'),
                                'cases': {fid: scores.get(fid) for fid in sorted(ids)}})
          status, _, body = get('https://raw.githubusercontent.com/arabsnipertech-bet/arabsniper2/main/data/live_watchlist.json')
          watch = decode(body)
          due = []
          for row in watch.get('fixtures', []):
              kickoff = datetime.fromisoformat(row['kickoff'])
              fid = str(row['fixture_id'])
              age = (observed - kickoff).total_seconds()
              if 135 * 60 < age <= 48 * 3600 and (scores.get(fid) or {}).get('status') not in ('FT', 'AET', 'PEN', 'PST', 'CANC', 'ABD', 'AWD', 'WO'):
                  due.append((kickoff, fid))
          show('watchlist', {'http': status, 'generated_at': watch.get('generated_at'),
                             'count': len(watch.get('fixtures', [])), 'overdue_in_sample_window': len(due)})
          key = os.environ.get('API_KEY')
          if not key:
              raise SystemExit('API-Football secret unavailable.')
          headers = {'x-apisports-key': key}
          football = 'https://v3.football.api-sports.io/'
          safe_headers = ('x-ratelimit-requests-limit', 'x-ratelimit-requests-remaining',
                          'x-ratelimit-limit', 'x-ratelimit-remaining', 'retry-after')
          def provider(path):
              code, meta, data = get(football + path, headers)
              payload = decode(data)
              errors = payload.get('errors') or {}
              diagnostic = {'http': code, 'headers': {k: meta[k] for k in safe_headers if k in meta},
                            'error_categories': sorted(set(errors) & {'rateLimit', 'requests', 'token', 'key', 'access', 'plan', 'ip'}) if isinstance(errors, dict) else []}
              return diagnostic, payload.get('response'), bool(errors)
          diagnostic, info, errors = provider('status')
          info = info if isinstance(info, dict) else {}
          quota = info.get('requests') or {}
          show('provider/status', dict(diagnostic, active=info.get('subscription', {}).get('active'), quota={k: quota.get(k) for k in ('current','limit_day')}))
          used, limit = quota.get('current'), quota.get('limit_day')
          if diagnostic['http'] != 200 or errors or info.get('subscription', {}).get('active') is not True or not isinstance(used, int) or not isinstance(limit, int) or limit - used <= max(1000, (limit + 9) // 10) or diagnostic['headers'].get('x-ratelimit-remaining') == '0':
              raise SystemExit('Fixture query deferred by provider quota or status.')
          ids.update(fid for _, fid in sorted(due, reverse=True)[:15])
          ids.add('1520978')
          diagnostic, rows, errors = provider('fixtures?' + urlencode({'ids': '-'.join(sorted(ids)), 'timezone': 'Europe/Rome'}))
          result = []
          for row in rows if isinstance(rows, list) else []:
              f = row.get('fixture') or {}
              fid = str(f.get('id'))
              if fid not in ids:
                  continue
              score = row.get('score') or {}
              result.append({'fixture_id': fid, 'date': f.get('date'), 'status': (f.get('status') or {}).get('short'),
                             'halftime': score.get('halftime'), 'fulltime': score.get('fulltime')})
          show('provider/fixtures', dict(diagnostic, rows=result, missing=sorted(ids - {row['fixture_id'] for row in result})))
          for fid in ('1644690', '1649517'):
              if diagnostic['headers'].get('x-ratelimit-remaining') in ('0','1','2'):
                  break
              d, data, rejected = provider('fixtures?' + urlencode({'id': fid, 'timezone':'Europe/Rome'}))
              rows = [{ 'status': (r.get('fixture') or {}).get('status'), 'id': (r.get('fixture') or {}).get('id'),
                        'league': (r.get('league') or {}).get('name'), 'score': r.get('score') }
                      for r in data if str((r.get('fixture') or {}).get('id')) == fid] if not rejected and isinstance(data, list) else []
              show('provider/fixture/' + fid, dict(d, rows=rows))
          if diagnostic['http'] != 200 or errors or not {'1644690','1649517'}.issubset({row['fixture_id'] for row in result}):
              raise SystemExit('The provider did not confirm both incident fixtures.')

          import boto3
          from botocore.config import Config
          s3 = boto3.client('s3', region_name='auto',
              endpoint_url='https://dfdb02b4139b31c0ab4456a50eb371a2.r2.cloudflarestorage.com',
              aws_access_key_id=os.environ.get('R2_ACCESS_KEY_ID'), aws_secret_access_key=os.environ.get('R2_SECRET_ACCESS_KEY'),
              config=Config(connect_timeout=5, read_timeout=18, retries={'total_max_attempts': 1}))
          def get_r2(name):
              with s3.get_object(Bucket='arabsniper-gold', Key=name)['Body'] as stream:
                  return json.load(stream)

          selected = {'1644690', '1649517'}
          found = {}
          real_gold = {}
          def record(match, origin):
              f = match.get('fixture') or {}
              fid = str(f.get('fixture_id'))
              if fid not in selected:
                  return
              if origin == 'browser_today':
                  real_gold[fid] = match
              v7 = ((match.get('multimarket') or {}).get('matrix') or {}).get('v7') or {}
              triad = v7.get('triad') or match.get('triad') or {}
              found.setdefault(fid, []).append({'location':origin,
                  'original_slot_count':sum(bool(x) for x in triad.values()),
                  'captured_before_kickoff': bool(v7.get('captured_at') and
                    datetime.fromisoformat(v7['captured_at']) < datetime.fromisoformat(f['kickoff'])),
                  'result_status':(f.get('result') or {}).get('status'),
                  'live_status':(f.get('live') or {}).get('status'),
                  'status_short':f.get('status_short')})
          board = get_r2('arab_quote_day1.json')
          for location in ('today', 'current_day_archive', 'previous_day'):
              part = board if location == 'today' else board.get(location) or {}
              for match in part.get('matches', []):
                  record(match, location)
          catalog = get_r2('arab_quote_model_research.json')
          import gzip
          index = (catalog.get('_gold_browser_days') or {}).get('arab_quote_day1.json') or {}
          for item in index.get('pages', []):
              digest = item['sha256']
              with s3.get_object(Bucket='arabsniper-gold', Key='_audit_parts/' + digest + '.json.gz')['Body'] as stream:
                  raw = gzip.decompress(stream.read())
              if len(raw) != item['bytes'] or hashlib.sha256(raw).hexdigest() != digest:
                  raise SystemExit('Gold page checksum mismatch')
              for match in json.loads(raw):
                  record(match, 'browser_today')
          show('gold_archive', {'date':board.get('date'), 'cases':found, 'verified_browser_pages':len(index.get('pages', []))})
          manifest = get_r2('state/current.json')['files']
          day = '2026-11-12'
          path = f'auditarchive/prematch_{day}_v7.json'
          item = manifest.get(path)
          if item:
              with s3.get_object(Bucket='arabsniper-gold', Key='state/objects/' + item['sha256'])['Body'] as stream:
                  raw = stream.read()
              if len(raw) != item['bytes'] or hashlib.sha256(raw).hexdigest() != item['sha256']:
                  raise SystemExit('Auditor checksum mismatch')
              audit = json.loads(raw)
              show('gold_auditor', {'date':day, 'counts':audit.get('counts'),
                   'fixture_count':len(audit.get('fixtures', {})),
                   'verified':True, 'generated_at':audit.get('generated_at')})
          else:
              show('gold_auditor', {'date':day, 'available':False})

          import sys
          sys.path.insert(0, 'src')
          from lateral_matrix import settle_spec
          from v7_archive import FINISHED, checked_score
          public_checks = {
              '1644690': {'status':'FT', 'home_ht':0, 'away_ht':0, 'home_ft':0, 'away_ft':0},
              '1649517': {'status':'FT', 'home_ht':0, 'away_ht':0, 'home_ft':1, 'away_ft':0},
          }
          if set(real_gold) != selected:
              raise SystemExit('Both original Gold fixtures are required for the replay')
          script = """
          const fs = require('node:fs');
          const matrix = require('./web/lateral-matrix.js');
          require('./web/live-scores.js');
          const {matches, scores, live} = JSON.parse(fs.readFileSync(0, 'utf8'));
          const out = {};
          const states = {won:[1,0],lost:[0,1],void:[0,0],half_won:[.5,0],half_lost:[0,.5]};
          for (const [id, match] of Object.entries(matches)) {
            const before = JSON.stringify(match);
            const result = scores[id];
            const view = matrix.publishedView(match);
            if (!view || Object.values(view.triad).filter(Boolean).length !== 3) throw Error('Missing rendered proposal');
            const observed = new Date().toISOString(), fulltime = {home:result.home_ft,away:result.away_ft};
            const feed = {schema_version:1,enabled:true,fixtures:{[id]:{fixture_id:id,status:'FT',
              fulltime,goals:fulltime,halftime:{home:result.home_ht,away:result.away_ht},observed_at:observed}}};
            if (live.enabled) ArabLive.accept(live);
            const production = Object.fromEntries(Object.entries(view.triad).map(([role,pick])=>[role,matrix.triadSettlement(match,pick.source.spec)]));
            ArabLive.accept(feed);
            const replay = Object.fromEntries(Object.entries(view.triad).map(([role,pick])=>[role,{
              label:pick.record.label, market_id:pick.signal.market_id,
              captured_at:view.v7.captured_at, outcome:matrix.triadSettlement(match,pick.source.spec)}]));
            if (JSON.stringify(match) !== before) throw Error('Original forecast changed during settlement');
            out[id] = {production, replay, score:ArabLive.view(match).score, ht:ArabLive.firstHalf(match).score};
            for (const item of Object.values(replay)) if (!states[item.outcome]) throw Error('Missing replay outcome');
          }
          process.stdout.write(JSON.stringify(out));
          """
          replay = json.loads(subprocess.check_output(['node', '-e', script],
              input=json.dumps({'matches':real_gold, 'scores':public_checks, 'live':live}).encode(), timeout=20))
          weights = {'won':(1,0), 'lost':(0,1), 'void':(0,0), 'half_won':(.5,0), 'half_lost':(0,.5)}
          for fid, item in replay.items():
              for pick in item['replay'].values():
                  if settle_spec(json.loads(pick['market_id']), public_checks[fid]) != weights[pick['outcome']]:
                      raise SystemExit('Browser and Auditor disagree on the real archived proposals')
          show('gold_replay', {'fixtures': len(replay), 'proposals': 6, 'browser_auditor_agree': True})
          pending_ids = []
          if item := manifest.get(path):
              pending_ids = sorted(fid for fid, row in audit.get('fixtures', {}).items() if row.get('status') == 'pending')
          if pending_ids and len(pending_ids) <= 20 and diagnostic['headers'].get('x-ratelimit-remaining') not in ('0','1','2'):
              result, provider_rows, rejected = provider('fixtures?' + urlencode({'ids':'-'.join(pending_ids),'timezone':'Europe/Rome'}))
              states = {}
              for row in provider_rows if isinstance(provider_rows, list) else []:
                  fixture = row.get('fixture') or {}
                  fid = str(fixture.get('id'))
                  if fid not in pending_ids:
                      continue
                  score = row.get('score') or {}
                  ft, ht = score.get('fulltime') or {}, score.get('halftime') or {}
                  state = (fixture.get('status') or {}).get('short')
                  states[fid] = checked_score({'status':state, 'home_ft':ft.get('home'), 'away_ft':ft.get('away'),
                     'home_ht':ht.get('home'), 'away_ht':ht.get('away')})
              from collections import Counter
              show('yesterday_provider', dict(result, checked=len(pending_ids),
                   statuses=dict(Counter(states.get(fid, {}).get('status') or 'missing' for fid in pending_ids)),
                   usable_finals=[fid for fid, row in states.items() if row['status'] in FINISHED and row['home_ft'] is not None and row['away_ft'] is not None]))
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          public = serialization.load_pem_public_key(("-----BEGIN PUBLIC KEY-----\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAy6YcG8X/s0xONGrdA1zy\n9ktycgp8FjmRCGTriZVhK3mgvKtlmZKQrW+XvmzOkB5XbrQfwcU93IZnM9g/1Nc0\nKKZem6LRuF+dlQRtcIBnkAYl45yJCADatxYBNZ0YMjz0V82QNrXUJGmqSwu+Qnlv\nYSxoSw6scbmiiD4bAmfeaG0LDotUFhTxvXwzDYGMBZQbqKFrRXNI/o/YkVaqbGfi\nwZ0b8jKHm5adSiJ460+eLMSGAl/258XQoHTL0S3Sl4x+0pBBdyYgNlTeJK6WzuXd\nl7/TTii+WoZ/GC83TtfKBwb5F4Xh43nR8MXmj3aigW2rYWm2ehjwGuJQ2nsE+UEp\nDfLfh0rhumcVmHQSiQpaV3YTKHnnyd04aDR38Tg8JPuInWZ3y/U+JrT5n6qHVspW\naRcap9IuhfJnvEEJZYcrNq5cEeARh4z0FsUFG1rtMaUUgby9lMafFHI73khjNWct\nF8Tz1aa7b7Px1J0QHZLALrKC4EqNORkArrmMpn87jCCrAgMBAAE=\n-----END PUBLIC KEY-----\n").encode())
          aes_key, nonce = AESGCM.generate_key(bit_length=256), os.urandom(12)
          aad = b'arabsniper-gold-results-incident'
          wrapped = public.encrypt(aes_key, padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          ciphertext = AESGCM(aes_key).encrypt(nonce, json.dumps(replay).encode(), aad)
          show('encrypted_replay', {key:base64.b64encode(value).decode() for key, value in
             {'key':wrapped,'nonce':nonce,'ciphertext':ciphertext}.items()})
