name: Recover confirmed Facebook slot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/facebook-recovery.yml']
  workflow_dispatch:
    inputs:
      recovery_slot:
        description: 'Confirmed Telegram slot to reconcile on Facebook'
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: facebook-page-publication
  cancel-in-progress: false
  queue: max
jobs:
  recover:
    # Retired by Publisher V7.1. Restore via the documented rollback.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow==11.3.0 requests==2.32.5
      - name: Verify Page identity and read access
        if: github.event_name == 'push'
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          PYTHONPATH: src
        run: |
          python -c 'from facebook_page import graph, PAGE; assert graph("me?fields=id")["id"] == PAGE; assert "data" in graph(PAGE + "/published_posts?fields=id&limit=1"); print("Facebook recovery credentials verified")'
      - name: Reconcile confirmed slot and publish only when absent
        if: github.event_name == 'workflow_dispatch'
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_SLOT: ${{ inputs.recovery_slot }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: python src/facebook_recovery.py
      - uses: actions/upload-artifact@v4
        if: steps.publish.outputs.name != ''
        with:
          name: ${{ steps.publish.outputs.name }}
          path: facebook-receipt.json
          retention-days: 7
