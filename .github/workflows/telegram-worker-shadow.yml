name: Telegram Cloudflare offline replay
on:
  push:
    branches: [prototype/telegram-worker-dry-run]
    paths: ['prototypes/telegram-preview/**', '.github/workflows/telegram-worker-shadow.yml']
permissions:
  contents: read
concurrency:
  group: telegram-private-shadow
  cancel-in-progress: true
jobs:
  replay:
    if: github.repository == 'arabsnipertech-bet/arabsniper2' && github.actor == 'arabsnipertech-bet'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare local runtimes
        run: |
          echo "SHADOW_INPUT=$RUNNER_TEMP/shadow-input" >> "$GITHUB_ENV"
          python -m pip install boto3 requests ijson==3.6.0 'Pillow>=11,<13' PyNaCl cryptography uv
          cd prototypes/telegram-preview
          npm install --no-save miniflare@4 esbuild @streamparser/json@0.0.22 wrangler@4.161.0
          python stage_renderer.py "$RUNNER_TEMP/shadow-worker"
      - name: Read fixed Gold objects and editorial receipts
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python prototypes/telegram-preview/capture.py
      - name: Compare all five boards through a workerd R2 binding
        run: |
          cd prototypes/telegram-preview
          python board_reference.py
          node board-replay.mjs
      - name: Compare media and receipt-backed captions in the Python Worker
        if: ${{ !cancelled() && hashFiles('prototypes/telegram-preview/media_replay.py') != '' }}
        run: |
          export PATH="$GITHUB_WORKSPACE/prototypes/telegram-preview/node_modules/.bin:$PATH"
          cd "$RUNNER_TEMP/shadow-worker"
          uv run pywrangler dev --ip 127.0.0.1 --port 8787 > "$RUNNER_TEMP/shadow-log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 100); do
            code=$(curl -s --max-time 3 -o /dev/null -w '%{http_code}' http://127.0.0.1:8787 || true)
            if [[ "$code" == 405 ]]; then break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 2
          done
          if [[ "$code" != 405 ]]; then tail -65 "$RUNNER_TEMP/shadow-log"; exit 1; fi
          cd "$GITHUB_WORKSPACE"
          python prototypes/telegram-preview/media_replay.py
      - name: Exercise no-send and receipt rules
        if: always()
        run: |
          node --test prototypes/telegram-preview/worker.test.mjs
          python -m unittest discover -s tests -p test_publisher_v71.py
