name: Diagnose missing Italy odds
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/italy_odds_diagnostic.py']
permissions:
  contents: read
concurrency:
  group: italy-odds-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Read provider responses without modifying forecasts
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: python src/italy_odds_diagnostic.py
