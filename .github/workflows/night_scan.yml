name: ArabSniper Night Scan

on:
  workflow_dispatch:

  schedule:
    - cron: "55 1 * * *"
      timezone: "Europe/Rome"

permissions:
  contents: write

concurrency:
  group: arabsniper-quote-engine
  cancel-in-progress: false

jobs:
  night-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests PyGithub

      - name: Create market catalog if missing
        run: |
          if [ ! -f data/arab_bet_catalog.json ]; then
            python src/3appdays_runner.py --catalog
          else
            echo "Catalogo mercati già presente"
          fi

      - name: Run ArabSniper night scan
        run: |
          python src/3appdays_runner.py --night --days 5

      - name: Verify generated files
        run: |
          echo "File ArabSniper prodotti:"
          ls -lh data/arab_quote_*.json

          test -f data/arab_quote_dashboard.json
          test -f data/arab_quote_state.json
          test -f data/arab_quote_day1.json
          test -f data/arab_quote_day2.json
          test -f data/arab_quote_day3.json
          test -f data/arab_quote_day4.json
          test -f data/arab_quote_day5.json

      - name: Publish generated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/arab_quote_*.json

          if git diff --cached --quiet; then
            echo "Nessuna variazione da pubblicare"
          else
            git commit -m "Update ArabSniper night quote data"
            git push
          fi
