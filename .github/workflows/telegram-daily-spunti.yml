name: Telegram daily three analytical spunti (public feed)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/telegram-daily-spunti.yml'
      - 'src/telegram_daily_spunti.py'
  pull_request:
    paths:
      - '.github/workflows/telegram-daily-spunti.yml'
      - 'src/telegram_daily_spunti.py'
      - 'tests/test_telegram_daily_spunti.py'
  workflow_dispatch:
    inputs:
      recovery_slot:
        description: 'Guarded backup slot; no forced selections'
        required: false
        type: string
  # UTC cron for 13:00/13:13 Rome, CET and CEST.
  schedule:
    - cron: '0 11 * * *'
    - cron: '13 11 * * *'
    - cron: '0 12 * * *'
    - cron: '13 12 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: telegram-channel-publication
  cancel-in-progress: false
jobs:
  spunti:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install boto3 requests
      - name: Test public data guards
        run: python3 -m unittest discover -s tests -p test_telegram_daily_spunti.py -v
      - name: Publish verified public pre-match spunti
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          RECOVERY_SLOT: ${{ inputs.recovery_slot }}
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SPUNTI_MIGRATION: '2026-11-04'
          ALLOW_ONEOFF: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Publish verified dashboard social spunti' }}
        run: python3 src/telegram_daily_spunti.py
      - name: Retain daily receipt
        if: hashFiles('spunti-receipt.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.publish.outputs.artifact }}
          path: spunti-receipt.json
          retention-days: 30
