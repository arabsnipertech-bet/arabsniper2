name: Freeze Audit Source

on:
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'
      timezone: 'Europe/Rome'

permissions:
  contents: write

concurrency:
  group: arabsniper-quote-data-writer
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run freeze script
        run: |
          python auditor/current_audit.py freeze

      - name: Commit and push freeze
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          if [ -d auditordata/_audit_parts ]; then git add auditordata/_audit_parts; fi
          if [ -d auditarchive/_audit_parts ]; then git add auditarchive/_audit_parts; fi
          git add auditordata/prematch_*.json
          git commit -m "Freeze audit source" || echo "No changes to commit"
          git push
