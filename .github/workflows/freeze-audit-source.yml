name: Freeze Audit Source

# Compatibility entry point only: each scan freezes its own new evidence.
# No hourly writer and no second historical audit process.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired-hourly-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Explain the nightly archive schedule
        run: echo 'Each scan freezes new evidence; historical processing runs at 00:30 Europe/Rome in Run Auditor.'
