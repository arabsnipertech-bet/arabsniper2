name: Freeze Audit Source

on:
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'
      timezone: 'Europe/Rome'

permissions:
  contents: write

concurrency:
  group: arabsniper-quote-data-writer
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run freeze script
        run: |
          python auditor/current_audit.py freeze

      - name: Commit and push freeze
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          if [ -d auditordata/_audit_parts ]; then git add auditordata/_audit_parts; fi
          if [ -d auditarchive/_audit_parts ]; then git add auditarchive/_audit_parts; fi
          git add auditordata/prematch_*.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Freeze audit source"
          for attempt in 1 2 3; do
            git fetch origin main
            # Replay the snapshot commit without overwriting newer remote files.
            # Conflicts fail visibly and the recovery artifact preserves the work.
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1

      - name: Preserve freeze if publication fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: freeze-recovery-${{ github.run_id }}
          retention-days: 14
          path: |
            auditordata/prematch_*.json
            auditordata/_audit_parts/
            auditarchive/_audit_parts/
