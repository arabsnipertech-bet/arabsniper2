name: Run Auditor

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'
      timezone: 'Europe/Rome'

permissions:
  contents: write
  actions: read

# Admission never joins the writer queue. Delayed daytime triggers exit first.
jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.window.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Admit only the protected nightly window
        id: window
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 src/auditor_schedule.py

  auditor:
    needs: admission
    if: needs.admission.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    # Final checkpoint mutex; the runner also enforces an absolute 01:50 cutoff.
    concurrency:
      group: arabsniper-quote-data-writer
      cancel-in-progress: false
      queue: max
    env:
      GOLD_PRIVATE: ${{ vars.GOLD_PRIVATE }}
      R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
      R2_BUCKET: arabsniper-gold
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      PYTHONUNBUFFERED: '1'
      API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install archive and storage dependencies
        run: pip install requests boto3 ijson==3.6.0
      - name: Run and publish the daily Auditor before 01:50 Rome
        id: nightly
        run: python src/nightly_auditor.py
      - name: Record verified daily Auditor completion
        if: steps.nightly.outputs.completed == 'true'
        run: echo "Daily Auditor completion verified in the published checkpoint."
