name: Run Auditor

on:
  workflow_dispatch:
  schedule:
    - cron: '7 9 * * *'
      timezone: 'Europe/Rome'

permissions:
  contents: write

concurrency:
  group: arabsniper-run-auditor
  cancel-in-progress: false

jobs:
  auditor:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Check frozen predictions for yesterday
        id: source
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          target = (datetime.now(ZoneInfo("Europe/Rome")).date() - timedelta(days=1)).isoformat()
          source = Path("auditordata") / f"freeze_for_audit_{target}.json"
          available = source.is_file()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"available={str(available).lower()}\n")
          message = (
              f"Audit {target}: previsioni congelate disponibili."
              if available else
              f"Audit {target} NON ESEGUITO: manca {source}. Nessun risultato creato o aggiornato. "
              "Non ricostruire previsioni dopo la partita."
          )
          print(message)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(message + "\n")
          PY

      - name: Run audit script
        if: steps.source.outputs.available == 'true'
        run: |
          python auditor/run_audit.py

      - name: Commit and push audit results
        if: steps.source.outputs.available == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add auditarchive/
          git commit -m "Run auditor" || echo "No changes to commit"
          git push
