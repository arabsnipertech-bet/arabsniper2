name: Run Auditor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/audit_storage.py'
      - 'src/audit_ledger.py'
      - 'src/scan_audit.py'
      - 'auditor/current_audit.py'
      - 'src/task_progress.py'
      - 'src/prematch_audit.py'
      - 'src/daily_audit.py'
      - 'src/homepage_results.py'
      - 'src/selection_studies.py'
      - 'src/filter_audit.py'
      - 'src/first_half_quality.py'
      - 'src/multimarket_model.py'
      - 'src/multimarket_audit.py'
      - 'src/model_research.py'
      - '.github/workflows/run-auditor.yml'
  schedule:
    - cron: '7 9 * * *'
      timezone: 'Europe/Rome'

permissions:
  contents: write

concurrency:
  group: arabsniper-quote-data-writer
  cancel-in-progress: false

jobs:
  auditor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOLD_PRIVATE: ${{ vars.GOLD_PRIVATE }}
      R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
      R2_BUCKET: arabsniper-gold
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      PYTHONUNBUFFERED: '1'
      API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install streaming archive parser
        run: pip install ijson==3.6.0

      - name: Prepare private storage client
        if: vars.GOLD_STORAGE_ENABLED == 'true' || vars.GOLD_PRIVATE == 'true'
        run: pip install boto3 ijson==3.6.0

      - name: Restore authoritative private checkpoint
        if: vars.GOLD_PRIVATE == 'true'
        run: python src/gold_storage.py restore

      - name: Archive forecasts and settle completed matches
        run: python auditor/current_audit.py settle
      - name: Compare multimarket models
        run: python src/task_progress.py src/model_research.py
      - name: Build public results from frozen forecasts
        run: python src/task_progress.py src/homepage_results.py
      - name: Save verified state in private storage
        if: vars.GOLD_STORAGE_ENABLED == 'true' || vars.GOLD_PRIVATE == 'true'
        run: python src/gold_storage.py publish

      - name: Publish only public projections
        if: vars.GOLD_PRIVATE == 'true'
        run: python src/private_publication.py

      - name: Save current audit archive and report
        if: vars.GOLD_PRIVATE != 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          if [ -d auditordata/_audit_parts ]; then git add auditordata/_audit_parts; fi
          if [ -d auditarchive/_audit_parts ]; then git add auditarchive/_audit_parts; fi
          git add auditordata/prematch_*.json auditarchive/prematch_*.json auditarchive/prematch_*_daily.md
          git add data/arab_quote_multimarket_report.json data/arab_quote_model_research.json data/arab_quote_results_public.json
          if git diff --cached --quiet; then
            echo "No audit changes"
            exit 0
          fi
          git commit -m "Update current prematch audit"
          git pull --rebase origin main
          git push origin HEAD:main


