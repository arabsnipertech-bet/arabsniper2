name: Run Auditor

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0,4 * * *'
      timezone: 'Europe/Rome'

permissions:
  contents: write
  actions: read

# Admission never joins the writer queue. Delayed daytime triggers exit first.
jobs:
  admission:
    if: github.repository == 'arabsnipertech-bet/arabsniper2' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.window.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Admit only the protected nightly window
        id: window
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 src/auditor_schedule.py
      - name: Record intentionally skipped duplicate or out-of-window Auditor
        if: steps.window.outputs.run == 'false'
        run: |
          echo "Auditor was not admitted: another data writer is running or the protected nightly window has passed."
          echo "The admission guard succeeded by preventing a redundant Auditor run."
          echo "Skipped admission is NOT a failed Auditor execution. Actual errors in admission or the Auditor job still fail the workflow." >> "$GITHUB_STEP_SUMMARY"

  auditor:
    needs: admission
    if: needs.admission.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    # Final checkpoint mutex; the runner also enforces an absolute 05:30 cutoff.
    concurrency:
      group: arabsniper-quote-data-writer
      cancel-in-progress: false
      queue: max
    env:
      GOLD_PRIVATE: ${{ vars.GOLD_PRIVATE }}
      R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
      R2_BUCKET: arabsniper-gold
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      PYTHONUNBUFFERED: '1'
      API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install archive and storage dependencies
        run: pip install requests boto3 ijson==3.6.0
      - name: Run and publish the daily Auditor
        id: nightly
        run: python src/nightly_auditor.py
      - name: Record verified daily Auditor completion
        if: steps.nightly.outputs.completed == 'true'
        run: echo "Daily Auditor completion verified in the published checkpoint."
      - name: Record the independent V7 checkpoint
        if: always() && steps.nightly.outputs.v7_completed == 'true'
        run: echo "V7 results, daily report and learning state verified in the published checkpoint." >> "$GITHUB_STEP_SUMMARY"
      - name: Record the legacy skip
        if: always() && steps.nightly.outputs.v51_status == 'partial_v51_skip'
        run: echo "V5.1 skipped within its bounded window. The V7 checkpoint was saved independently." >> "$GITHUB_STEP_SUMMARY"
      - name: Record saved partial progress
        if: steps.nightly.outputs.paused == 'true'
        run: echo "Historical chunk saved. More dates remain; this is NOT full Auditor certification."
