name: One-time late Telegram triple Nov 3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/telegram-oneoff-20261103.yml'
      - 'src/telegram_oneoff_20261103.py'
  pull_request:
    paths:
      - '.github/workflows/telegram-oneoff-20261103.yml'
      - 'src/telegram_oneoff_20261103.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: telegram-channel-publication
  cancel-in-progress: false
jobs:
  triple:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Publish one-off Telegram triple 2026-11-03')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow==11.3.0 requests==2.32.5 boto3
      - name: Prepare fresh Gold/Platinum selections; fail closed if insufficient
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python3 src/telegram_oneoff_20261103.py
      - name: Render true 3-pick Telegram card
        if: steps.prepare.outputs.name != ''
        run: python3 src/telegram_card.py post.json telegram-card.png
      - name: Reserve unique message
        if: steps.prepare.outputs.name != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.name }}-claim
          path: post.json
          retention-days: 3
      - name: Publish one-time triple
        if: steps.prepare.outputs.name != ''
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 src/telegram_digest.py send
      - name: Record sent triple
        if: steps.prepare.outputs.name != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.name }}-sent
          path: post.json
          retention-days: 3
