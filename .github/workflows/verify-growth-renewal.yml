name: Read restored score coverage
on:
  push:
    branches: [repair/verify-growth-r2-renewal]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: src
      - run: pip install boto3
      - name: Compare six pending fixtures with the existing official relay
        env:
          PYTHONPATH: src
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          from gold_storage import client
          ids = {'1549555','1549561','1549562','1564907','1631644','1631807'}
          with client().get_object(Bucket=os.environ['R2_BUCKET'],Key='live-scores/provider-relay.json')['Body'] as b:
              relay = json.load(b)
          for r in relay['fixtures']:
              f = r['fixture']
              if str(f['id']) in ids:
                  print('Official relay',f['id'],f['date'],f['status']['short'],r['score'])
          with urllib.request.urlopen('https://arabsniperbet.com/api/live-scores',timeout=15) as b:
              live = json.load(b)
          print('Health',live['status'],live['health']['stale_live_fixtures'],live['health']['overdue_fixtures'],live['health'].get('provider_pending_fixtures'))
          for fid in sorted(ids):
              r = live['fixtures'].get(fid) or {}
              print('Live cache',fid,{k:v for k,v in r.items() if k in ('status','status_short','goals','score','halftime','fulltime','provider_kickoff','observed_at','updated_at','provider_pending','ht','ft')})
          PY
