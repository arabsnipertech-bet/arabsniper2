name: Verify restored Gold coverage
on:
  push:
    branches: [repair/verify-growth-r2-renewal]
permissions:
  contents: read
  actions: write
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check the independent verifier after the restored relay
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: arabsnipertech-bet/arabsniper2
        run: |
          set -eu
          finished=$(gh api repos/$GH_REPO/actions/runs/44368243756 --jq '.updated_at')
          count=$(gh api "repos/$GH_REPO/actions/workflows/live-scores-health.yml/runs?branch=main&per_page=10" | jq --arg after "$finished" '[.workflow_runs[] | select(.created_at >= $after)] | length')
          if [ "$count" -eq 0 ]; then
            gh workflow run live-scores-health.yml --ref main
          fi
