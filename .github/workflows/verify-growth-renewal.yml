name: Verify and renew Growth storage access
on:
  push:
    branches: [repair/verify-growth-r2-renewal]
permissions:
  contents: read
jobs:
  renew:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'boto3>=1.42,<2' 'requests>=2.32,<3' 'PyNaCl>=1.5,<2' 'Pillow>=11,<13' ijson==3.6.0
      - name: Renew after verifying the scoped R2 writes
        env:
          PYTHONPATH: src
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from gold_results_handoff import storage
          from publisher_v71 import bridge
          s = storage()
          for params in [{}, dict(name=bridge.GOLD_RESULTS_SESSION, prefix=bridge.GOLD_RESULTS_PREFIX, objects=bridge.GOLD_RESULTS_KEYS, actions=('GetObject','PutObject'))]:
              bridge.refresh_session(s,datetime.now(timezone.utc),force=True,**params)
          PY
