name: Read-only current quote coverage
on:
  workflow_dispatch:
  push:
    branches: [codex/quote-coverage-20261030]
    paths: ['auditor/quote_coverage.py', '.github/workflows/quote-coverage.yml']
permissions:
  contents: read
concurrency:
  group: quote-coverage-audit
  cancel-in-progress: false
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: dcad78027cba3b79661e4f09e571ecb18bf8bc53
          path: baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests boto3 ijson==3.6.0
      - name: Compare parsers on identical current API snapshots
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BASELINE_ROOT: ${{ github.workspace }}/baseline
        run: python candidate/auditor/quote_coverage.py
      - uses: actions/upload-artifact@v4
        with:
          name: quote-coverage-aggregate
          path: candidate/coverage-audit/coverage.json
          if-no-files-found: error
          retention-days: 14
