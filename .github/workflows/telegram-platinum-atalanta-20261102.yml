name: One-time Atalanta Parma verified Platinum Telegram delivery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/telegram-platinum-atalanta-20261102.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: telegram-channel-publication
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow==11.3.0 requests==2.32.5
      - name: Verify kickoff and make the audited Platinum selection
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          python3 - <<'PY'
          import datetime,json,os,pathlib,subprocess
          from zoneinfo import ZoneInfo
          import requests
          now=datetime.datetime.now(ZoneInfo("Europe/Rome"))
          kickoff=datetime.datetime.fromisoformat("2026-11-02T20:45:00+01:00")
          if not datetime.datetime.fromisoformat("2026-11-02T19:00:00+01:00") <= now < kickoff:
              raise SystemExit("Outside the permitted prematch publication window")
          name="tg-2026-11-02-2000"
          for suffix in ("-claim","-sent"):
              data=json.loads(subprocess.check_output(["gh","api",f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts?name={name+suffix}&per_page=100"],text=True))
              if any(a["name"]==name+suffix and not a["expired"] for a in data.get("artifacts",[])):
                  raise SystemExit("Already reserved or published: "+suffix)
          key=os.environ.get("API_SPORTS_KEY")
          if not key: raise SystemExit("No API-Sports key")
          resp=requests.get("https://v3.football.api-sports.io/fixtures",params={"date":"2026-11-02","timezone":"Europe/Rome"},headers={"x-apisports-key":key},timeout=35)
          resp.raise_for_status(); payload=resp.json()
          if payload.get("errors") or not isinstance(payload.get("response"),list):
              raise SystemExit("API result invalid")
          games=[]
          for match in payload["response"]:
              teams=match.get("teams") or {}
              home=(teams.get("home") or {}).get("name","").lower()
              away=(teams.get("away") or {}).get("name","").lower()
              if "atalanta" in home and "parma" in away:
                  games.append(match)
          if len(games)!=1: raise SystemExit("Could not uniquely verify Atalanta - Parma")
          game=games[0]
          fixture=game.get("fixture") or {}
          start=datetime.datetime.fromisoformat(fixture["date"].replace("Z","+00:00")).astimezone(ZoneInfo("Europe/Rome"))
          if start.strftime("%Y-%m-%d %H:%M")!="2026-11-02 20:45" or (fixture.get("status") or {}).get("short") not in ("NS","TBD"):
              raise SystemExit("Official match not verifiably pregame")
          fid=str(fixture["id"])
          pick={"id":fid,"match":"Atalanta - Parma","label":"Over 1,5 PT",
                "market":"over15_ht","odd":2.2,"kickoff":start.isoformat(),
                "captured_at":"2026-11-02T19:00:20+01:00","score":91.3,
                "signal":"platinum-screenshot-verified"}
          caption=("🏆 ArabSniperBet · PRONOSTICO PLATINUM\n\n"
                   "⚽ Atalanta – Parma · Serie A\n"
                   "🕣 Calcio d'inizio: 20:45\n"
                   "🎯 Over 1,5 gol PRIMO TEMPO\n"
                   "💰 Quota osservata: 2,20 (Bet365 · ore 19:00)\n\n"
                   "📊 Dati ArabSniper della scheda Platinum:\n"
                   "• Statistica modello: 52,0%\n"
                   "• OCI: +91,3 · 8/8 operatori concordi\n"
                   "• Quota d'apertura 2,50 → 2,20 (-12,0%)\n"
                   "• EV stimato: +14,3%\n\n"
                   "📈 Studiamo quote, statistiche e movimenti di mercato.\n"
                   "👑 Area Gold: https://arabsniperbet.com/gold-dashboard-live.html\n"
                   "📲 https://t.me/arabsniper_signals\n"
                   "⚠️ Quota variabile. Nessun risultato è garantito. 18+.")
          pathlib.Path("post.json").write_text(json.dumps({"picks":[pick],"text":caption},ensure_ascii=False))
          with open(os.environ["GITHUB_OUTPUT"],"a") as o:o.write("name="+name+"\n")
          print("Official fixture verified:",fid,"kickoff:",start.isoformat())
          PY
      - name: Render Platinum graphical card
        run: python3 src/telegram_card.py post.json telegram-card.png
      - uses: actions/upload-artifact@v4
        with:
          name: tg-2026-11-02-2000-claim
          path: post.json
          retention-days: 3
      - name: Send Platinum photo + caption
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 src/telegram_digest.py send
      - uses: actions/upload-artifact@v4
        with:
          name: tg-2026-11-02-2000-sent
          path: post.json
          retention-days: 3
