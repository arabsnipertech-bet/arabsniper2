name: Encrypted Over PT and GG FT review
on:
  pull_request:
    types: [opened]
    paths:
      - 'auditor/over15_ggft_review.py'
      - 'auditor/over15-ggft-recipient-public.pem'
      - '.github/workflows/over15-ggft-review.yml'
permissions:
  contents: read
jobs:
  research:
    if: github.repository == 'arabsnipertech-bet/arabsniper2' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'analysis/over15-ggft-20261123' && github.event.pull_request.user.login == 'arabsnipertech-bet'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install boto3 cryptography ijson==3.6.0
      - name: Read existing closed-day archives only
        env:
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python auditor/over15_ggft_review.py
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-over15-ggft-review
          path: encrypted-review/over15-ggft.enc.json
          retention-days: 1
          if-no-files-found: error
