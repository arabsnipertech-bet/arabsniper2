name: One-time recovery of 21:15 Gold promotion on 2026-11-03
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/telegram-promo-2115-recover-once-20261103.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: telegram-channel-publication
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recover 21:15 via verified Telegram post and normal receipt
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,sys,json
          from pathlib import Path
          from datetime import datetime,timedelta,time
          from zoneinfo import ZoneInfo
          sys.path.insert(0,'src')
          from telegram_gold_promo import telegram,posted_before,MESSAGES
          now=datetime.now(ZoneInfo("Europe/Rome"))
          due=now.replace(hour=21,minute=15,second=0,microsecond=0)
          if now.date().isoformat()!='2026-11-03' or not timedelta(0)<=now-due<=timedelta(minutes=40):
              raise SystemExit("Outside the authorized 21:15 Rome publication window")
          name='telegram-gold-promo-2026-11-03-2115-sent'
          if posted_before(name):
              print("PROMO_ALREADY_RECORDED",flush=True)
              raise SystemExit(0)
          token=os.environ.get('TELEGRAM_BOT_TOKEN')
          if not token:raise RuntimeError("Missing Telegram token")
          bot=telegram('getMe',token)
          if bot.get('username','').lower()!='arabsniperbot':
              raise RuntimeError("Unexpected bot identity")
          channel=telegram('getChat',token,chat_id='@arabsniper_signals')
          admin=telegram('getChatMember',token,chat_id=channel['id'],user_id=bot['id'])
          if channel.get('username','').lower()!='arabsniper_signals' or admin.get('status')!='administrator' or not admin.get('can_post_messages'):
              raise RuntimeError("Telegram channel posting rights missing")
          sent=telegram('sendMessage',token,chat_id=channel['id'],text=MESSAGES[2],
                        disable_web_page_preview='true')
          if sent.get('chat',{}).get('id')!=channel['id']:
              raise RuntimeError("Telegram post not confirmed")
          Path('promo-receipt.json').write_text(json.dumps({
              'date':'2026-11-03','slot':'21:15','message_id':sent['message_id'],
              'channel':'@arabsniper_signals'},ensure_ascii=False),encoding='utf8')
          print(f"EVENING_PROMO_SENT https://t.me/arabsniper_signals/{sent['message_id']}",flush=True)
          PY
      - name: Save normal 21:15 sent receipt
        if: hashFiles('promo-receipt.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: telegram-gold-promo-2026-11-03-2115-sent
          path: promo-receipt.json
          retention-days: 14
          if-no-files-found: error
