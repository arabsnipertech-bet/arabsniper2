name: Telegram schedule watchdog tests
on:
  pull_request:
    paths:
      - 'src/telegram_watchdog.py'
      - 'src/telegram_digest.py'
      - 'src/telegram_gold_promo.py'
      - 'src/telegram_evidence.py'
      - 'tests/test_telegram_watchdog.py'
      - 'tests/test_telegram_digest.py'
      - 'tests/test_telegram_gold_promo.py'
      - 'tests/test_telegram_evidence.py'
      - '.github/workflows/telegram-backup-tests.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tests -p 'test_telegram_watchdog.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_telegram_digest.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_telegram_gold_promo.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_telegram_evidence.py' -v
