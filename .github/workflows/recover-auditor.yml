name: Recover Auditor checkpoint
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-auditor.yml']
  workflow_dispatch:
    inputs:
      date:
        description: 'Authorized recovery date in Europe/Rome'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: arabsniper-quote-data-writer
  cancel-in-progress: false
  queue: max
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GOLD_PRIVATE: ${{ vars.GOLD_PRIVATE }}
      R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
      R2_BUCKET: arabsniper-gold
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
      PYTHONUNBUFFERED: '1'
      RECOVERY_DATE: ${{ inputs.date || '2026-11-05' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests boto3 ijson==3.6.0
      - name: Resume authoritative checkpoint and publish verified completion
        run: python src/nightly_auditor.py --recovery-date "$RECOVERY_DATE"
