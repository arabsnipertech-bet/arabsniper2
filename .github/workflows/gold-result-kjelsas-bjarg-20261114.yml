name: Gold result Kjelsas–Bjarg

on:
  push:
    branches: [main]
    paths: ['.github/workflows/gold-result-kjelsas-bjarg-20261114.yml']

permissions:
  contents: read

concurrency: gold-result-1648248-20261114

jobs:
  publish:
    if: github.repository == 'arabsnipertech-bet/arabsniper2' && github.run_attempt == 1 && startsWith(github.event.head_commit.message, 'Publish the verified Kjelsas-Bjarg result')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - run: test "$(TZ=Europe/Rome date +%F)" = 2026-11-14
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            src
            .github/ops/publish-kjelsas-bjarg.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'boto3>=1.42,<2' 'requests>=2.32,<3' ijson==3.6.0
      - name: Confirm the Gold record and publish the result
        env:
          PYTHONPATH: src
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          META_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: python .github/ops/publish-kjelsas-bjarg.py
