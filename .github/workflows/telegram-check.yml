name: Verify Telegram channel
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/telegram-check.yml']
permissions: {}
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify identity and channel posting rights
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SEND_INITIAL_TEST: ${{ github.event_name == 'push' && github.run_attempt == '1' && github.event.head_commit.message == 'Verify the ArabSniper Telegram channel connection' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          import urllib.error
          token = os.environ["BOT_TOKEN"].strip()
          if not token:
              raise SystemExit("Missing TELEGRAM_BOT_TOKEN")
          channel = "@arabsniper_signals"
          def call(method, **fields):
              try:
                  request = urllib.request.Request(
                      "https://api.telegram.org/bot" + token + "/" + method,
                      data=urllib.parse.urlencode(fields).encode())
                  with urllib.request.urlopen(request, timeout=15) as response:
                      return json.load(response)["result"]
              except urllib.error.HTTPError as exc:
                  raise SystemExit(f"{method}: Telegram HTTP {exc.code}") from None
              except Exception:
                  raise SystemExit(f"{method}: no verified response") from None
          bot = call("getMe")
          if not bot["is_bot"] or bot["username"].lower() != "arabsniperbot":
              raise SystemExit("Unexpected bot identity")
          chat = call("getChat", chat_id=channel)
          if chat["type"] != "channel" or chat["username"].lower() != channel[1:]:
              raise SystemExit("Unexpected channel identity")
          member = call("getChatMember", chat_id=chat["id"], user_id=bot["id"])
          if member["status"] != "administrator" or not member.get("can_post_messages"):
              raise SystemExit("Channel posting permission missing")
          print("Verified @ArabSniperBot can publish to " + channel)
          if os.environ["SEND_INITIAL_TEST"] == "true":
              sent = call("sendMessage", chat_id=chat["id"], disable_notification="true",
                          text="ArabSniper · Verifica tecnica del collegamento al canale.")
              if sent["chat"]["id"] != chat["id"]:
                  raise SystemExit("Unexpected message destination")
              print("Test post: https://t.me/arabsniper_signals/" + str(sent["message_id"]))
          PY
