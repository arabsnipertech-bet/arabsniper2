name: Verifica revisioni Gold sulle schede di domani
on:
  push:
    branches: ['ops/read-v7-lock-evidence-20261116']
    paths: ['.github/workflows/read-v7-lock-evidence-20261116.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'arabsnipertech-bet/arabsniper2' && github.event.before == '1ba9e37efbf692f247185af1642c05a2bd7a368f' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '778ad7ac5e263ec7d5a51677644d0b660459dfc4'
          persist-credentials: false
          sparse-checkout: src
      - run: python3 -m pip install boto3 ijson==3.6.0 requests
      - name: Riproduci le decisioni sulle fotografie prematch del 17 novembre
        env:
          PYTHONPATH: src
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python3 - <<'PY'
          from collections import Counter
          import json
          import os
          from pathlib import Path
          from tempfile import TemporaryDirectory
          
          from audit_storage import read_store
          from gold_competitions import national_competition
          from gold_storage import client, previous_manifest, restore_subset
          from multimarket_model import stamp
          from v7_archive import valid_snapshot
          from v7_decision import revise_priced_slots, route
          
          def main():
              storage, bucket = client(), os.environ['R2_BUCKET']
              index = previous_manifest(storage, bucket)
              paths = [f'data/arab_quote_day{i}.json' for i in (1, 2, 3)]
              with TemporaryDirectory() as tmp:
                  root = Path(tmp)
                  restore_subset(storage, bucket, root, index, set(paths) & index.keys())
                  days = [read_store(root/name, {}) for name in paths]
              day = next(d for d in days if d.get('date') == '2026-11-17')
              report = {'national': Counter(), 'club': Counter()}
              for match in day.get('matches', []):
                  fixture = match.get('fixture') or {}
                  v7 = ((match.get('multimarket') or {}).get('matrix') or {}).get('v7') or {}
                  captured, kickoff = stamp(v7.get('captured_at')), stamp(fixture.get('kickoff'))
                  if not (captured and kickoff and valid_snapshot(v7, fixture, v7['captured_at'])):
                      continue
                  national = bool(national_competition(fixture.get('league')))
                  tally = report['national' if national else 'club']
                  tally['verified_snapshots'] += 1
                  old = v7.get('triad_commitments') or {}
                  if not old:
                      continue
                  tally['existing_commitments'] += 1
                  tally['already_revised'] += any(pick.get('replaces') for pick in old.values())
                  markets, observed = v7['markets'], v7['signals']['observations']
                  new = revise_priced_slots(markets, observed, old, captured, kickoff, national=national)
                  changed = [role for role in old if old[role]['market_id'] != new[role]['market_id']]
                  assert len(changed) <= 1
                  if not changed:
                      continue
                  role = changed[0]
                  assert new[role]['replaces'] == old[role]
                  active, _ = route(markets, observed, locked={r: pick['market_id'] for r, pick in new.items()})
                  assert active[role] and active[role]['market_id'] == new[role]['market_id']
                  tally['eligible_revisions_on_recorded_prices'] += 1
              print('GOLD_REVISION_REPLAY=' + json.dumps(report, sort_keys=True))
          
          try:
              main()
          except Exception as exc:
              raise SystemExit('Gold replay failed: ' + type(exc).__name__) from None
          PY
