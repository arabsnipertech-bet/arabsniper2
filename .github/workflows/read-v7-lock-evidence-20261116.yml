name: Verifica il feed Gold pubblicato per il 17 novembre
on:
  push:
    branches: ['ops/read-v7-lock-evidence-20261116']
    paths: ['.github/workflows/read-v7-lock-evidence-20261116.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'arabsnipertech-bet/arabsniper2' && github.event.before == '805f86bc490332dfe2618507c281f1670595b558' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '778ad7ac5e263ec7d5a51677644d0b660459dfc4'
          persist-credentials: false
          sparse-checkout: src
      - run: python3 -m pip install boto3 ijson==3.6.0 requests
      - name: Verifica le schede dal feed privato pubblicato
        env:
          PYTHONPATH: src
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          
          from gold_storage import client, read_checkpoint_object
          from multimarket_model import stamp
          from v7_archive import valid_snapshot
          
          def main():
              storage, bucket = client(), os.environ['R2_BUCKET']
              boards = []
              for key in ('arab_quote_day2.json', 'arab_quote_day1.json'):
                  payload = json.loads(read_checkpoint_object(storage, bucket, key))
                  if payload.get('date') == '2026-11-17':
                      boards.append(payload)
                      break
              if not boards:
                  raise ValueError('Gold date not found')
              board = boards[0]
              refreshed = stamp(board.get('opportunity_refreshed_at') or board.get('updated_at'))
              minimum = stamp('2026-11-16T22:52:24+00:00')
              if not refreshed or refreshed < minimum:
                  raise ValueError('Gold date has not been refreshed by this release')
              verified, complete, revisions, matches = 0, 0, 0, {}
              for match in board['matches']:
                  fixture = match['fixture']
                  matches[str(fixture['fixture_id'])] = match
              if len(matches) != len(board['matches']):
                  raise ValueError('Repeated fixture identifiers')
              for match in matches.values():
                  fixture = match['fixture']
                  snapshot = ((match.get('multimarket') or {}).get('matrix') or {}).get('v7') or {}
                  if not valid_snapshot(snapshot, fixture, snapshot.get('captured_at')):
                      continue
                  verified += 1
                  complete += sum(bool(pick) for pick in snapshot['triad'].values()) == 3
                  revised = [p for p in (snapshot.get('triad_commitments') or {}).values() if p.get('replaces')]
                  if len(revised) > 1 or any(p['market_id'] == p['replaces']['market_id'] for p in revised):
                      raise ValueError('Invalid revision history')
                  revisions += len(revised)
              print('PUBLISHED_GOLD_RECEIPT=' + json.dumps({
                  'date': board['date'], 'refreshed_at': refreshed.isoformat(), 'fixtures': len(matches),
                  'verified_snapshots': verified, 'complete_triads': complete, 'revisions': revisions,
              }, sort_keys=True), flush=True)
          
          try:
              main()
          except Exception as exc:
              raise SystemExit('Published Gold verification failed: ' + type(exc).__name__) from None
          PY
