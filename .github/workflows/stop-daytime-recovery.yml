name: Stop daytime Auditor recovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stop-daytime-recovery.yml']
permissions:
  actions: write
jobs:
  stop:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Release scans by cancelling only the authorized daytime recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          base = 'https://api.github.com/repos/arabsnipertech-bet/arabsniper2/actions/runs/42077586094'
          headers = {'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          with urllib.request.urlopen(urllib.request.Request(base, headers=headers), timeout=30) as response:
              run = json.load(response)
          assert run['path'] == '.github/workflows/recover-auditor.yml' and run['head_branch'] == 'main'
          if run['status'] != 'completed':
              with urllib.request.urlopen(urllib.request.Request(base+'/cancel', headers=headers, data=b'', method='POST'), timeout=30) as response:
                  print('Cancellation requested:', response.status)
          else:
              print('Recovery already completed:', run['conclusion'])
          PY
