name: Recover verified daily results
run-name: Recover verified daily results · ${{ inputs.date || 'yesterday' }}
on:
  schedule:
    - cron: '25 7,13,19 * * *'
      timezone: 'Europe/Rome'
  workflow_run:
    workflows: [Run Auditor]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      date:
        description: 'Giornata chiusa da recuperare (vuoto = ieri, ora italiana)'
        required: false
      refresh:
        description: 'Verifica di nuovo i risultati ufficiali di una giornata chiusa'
        type: boolean
        default: false
permissions:
  contents: read
env:
  GOLD_PRIVATE: ${{ vars.GOLD_PRIVATE }}
  R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
  R2_BUCKET: arabsniper-gold
  PYTHONUNBUFFERED: '1'
jobs:
  eligibility:
    if: github.repository == 'arabsnipertech-bet/arabsniper2' && github.ref == 'refs/heads/main' && vars.GOLD_PRIVATE == 'true' && (github.event_name != 'workflow_run' || (github.event.workflow_run.head_repository.full_name == github.repository && contains(fromJSON('["failure","timed_out"]'), github.event.workflow_run.conclusion)))
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      recover: ${{ steps.check.outputs.recover }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_ID: ${{ github.event.workflow_run.id }}
          AUDIT_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          recover=true
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            recover=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$AUDIT_ID/attempts/$AUDIT_ATTEMPT/jobs" \
              --jq 'any(.jobs[]; .name == "auditor" and (.conclusion == "failure" or .conclusion == "timed_out"))')
          fi
          echo "recover=$recover" >> "$GITHUB_OUTPUT"
  prepare:
    needs: eligibility
    if: needs.eligibility.outputs.recover == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: arabsniper-audit-recovery-prepare
      cancel-in-progress: false
      queue: max
    # Preparation reads immutable archives outside the writer mutex.
    timeout-minutes: 240
    outputs:
      date: ${{ steps.day.outputs.date }}
      digest: ${{ steps.recover.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests boto3 ijson==3.6.0
      - name: Find the next closed day requiring verification
        id: plan
        if: github.event_name == 'schedule'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python auditor/recover_daily.py plan
      - id: day
        if: github.event_name != 'schedule' || steps.plan.outputs.date != ''
        env:
          REQUESTED_DAY: ${{ inputs.date || steps.plan.outputs.date }}
          AUDITOR_STARTED: ${{ github.event.workflow_run.run_started_at }}
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from datetime import date, datetime, timedelta
          from zoneinfo import ZoneInfo
          import os
          from audit_official_scores import LOOKBACK_DAYS
          from auditor_schedule import ensure_recoverable_day
          rome = ZoneInfo('Europe/Rome')
          today = datetime.now(rome).date()
          reference = today
          if started := os.environ.get('AUDITOR_STARTED'):
              reference = datetime.fromisoformat(started).astimezone(rome).date()
          requested = os.environ.get('REQUESTED_DAY')
          day = date.fromisoformat(requested) if requested else reference - timedelta(days=1)
          ensure_recoverable_day(day)
          if not 1 <= (today-day).days <= LOOKBACK_DAYS: raise ValueError('Expected a recent closed day')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out: print(f'date={day}', file=out)
          PY
      - name: Verify frozen observations and official scores for one day
        id: recover
        if: steps.day.outputs.date != ''
        env:
          DAY: ${{ steps.day.outputs.date }}
          RECOVERY_REFRESH: ${{ (inputs.refresh || github.event_name == 'schedule') && 'true' || 'false' }}
          RECOVERY_RECHECK_RESULTS: ${{ inputs.refresh && 'true' || 'false' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: python auditor/recover_daily.py prepare --date "$DAY"
  publish:
    needs: prepare
    if: needs.prepare.outputs.digest != ''
    permissions:
      contents: write
    concurrency:
      group: arabsniper-quote-data-writer
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests boto3 ijson==3.6.0
      - name: Commit verified daily report to latest checkpoint and publish results
        env:
          DAY: ${{ needs.prepare.outputs.date }}
          REPORT_DIGEST: ${{ needs.prepare.outputs.digest }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python auditor/recover_daily.py publish --date "$DAY"
