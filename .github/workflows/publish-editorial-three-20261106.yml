name: Publish neutral three-match editorial
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-editorial-three-20261106.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: editorial-three-20261106
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests boto3 Pillow==11.3.0
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 42236481795 -n editorial-three-data -D editorial
      - env:
          PYTHONPATH: src
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python src/editorial_three_20261106.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-three-receipt
          path: |
            editorial-receipt.json
            editorial.jpg
          retention-days: 30
