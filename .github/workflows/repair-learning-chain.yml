name: Repair learning chain
on:
  workflow_dispatch:
    inputs:
      dates:
        description: 'JSON list of closed Rome dates (within 14 days)'
        default: '["2026-11-05","2026-11-06"]'
        required: true
  push:
    branches: [main]
    paths: ['.github/workflows/repair-learning-chain.yml']
permissions:
  contents: read
env:
  GOLD_PRIVATE: ${{ vars.GOLD_PRIVATE }}
  R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
  R2_BUCKET: arabsniper-gold
  PYTHONUNBUFFERED: '1'
jobs:
  prepare:
    if: github.repository == 'arabsnipertech-bet/arabsniper2' && github.ref == 'refs/heads/main' && vars.GOLD_PRIVATE == 'true'
    strategy:
      fail-fast: false
      matrix:
        date: ${{ fromJSON(inputs.dates || '["2026-11-05","2026-11-06"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests boto3 ijson==3.6.0
      - name: Verify live checkpoint and recover immutable inputs and official outcomes
        id: repair
        env:
          DAY: ${{ matrix.date }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: python auditor/recover_daily.py prepare --date "$DAY"
      - name: Record verified staging digest
        env:
          DIGEST: ${{ steps.repair.outputs.digest }}
        run: printf '%s' "$DIGEST" > recovery-digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-${{ matrix.date }}
          path: recovery-digest.txt
          retention-days: 7
  publish:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        date: ${{ fromJSON(inputs.dates || '["2026-11-05","2026-11-06"]') }}
    concurrency:
      group: arabsniper-quote-data-writer
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests boto3 ijson==3.6.0
      - uses: actions/download-artifact@v4
        with:
          name: recovery-${{ matrix.date }}
      - name: Publish complete chain without changing frozen predictions
        env:
          DAY: ${{ matrix.date }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          export REPORT_DIGEST="$(cat recovery-digest.txt)"
          python auditor/recover_daily.py publish --date "$DAY"
  calibrate:
    needs: publish
    concurrency:
      group: arabsniper-quote-data-writer
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests boto3 ijson==3.6.0
      - name: Retrain from verified daily evidence with exact SHA-256 provenance
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python auditor/repair_calibration.py
