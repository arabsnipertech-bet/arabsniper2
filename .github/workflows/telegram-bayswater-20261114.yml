name: Post Bayswater halftime review on Telegram
on:
  push:
    branches: [ops/telegram-bayswater-2026-11-14]
    paths: ['.github/workflows/telegram-bayswater-20261114.yml']
permissions:
  contents: read
concurrency:
  group: telegram-bayswater-halftime-1640365
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'arabsnipertech-bet/arabsniper2' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
      BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      POST_TEXT: |-
        ☀️ Buongiorno da ArabSniperBet!

        Bayswater City–Sydney Olympic, 5ª giornata dell’Australian Championship (14 novembre). Nell’anteprima Gold delle 07:46 italiane, l’ipotesi di studio era Over 2,5 nel primo tempo, con quota 4,50 registrata alle 07:01.

        ⚽ 2–1 all’intervallo. I tre gol del primo tempo confermano l’ipotesi per questa partita.

        Scheda prepartita https://github.com/arabsnipertech-bet/arabsniper2/blob/bd6cfca33b710182967f973ed330d69508210e17/homepage.json
        Risultato https://arabsniperbet.com/api/live-scores?id=1640365
    steps:
      - name: Verify archived preview and halftime, then post once
        run: |
          python3 - <<'PY'
          from base64 import b64decode
          import json
          import os
          from datetime import datetime
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from zoneinfo import ZoneInfo

          channel = 'arabsniper_signals'
          fixture_id = '1640365'
          now = datetime.now(ZoneInfo('Europe/Rome'))
          if now.date().isoformat() != '2026-11-14' or now.hour >= 12:
              raise SystemExit('Outside the authorized morning publication window')

          def read(stage, url, fields=None, headers=None):
              data = urlencode(fields).encode() if fields is not None else None
              try:
                  with urlopen(Request(url, data=data, headers=headers or {}), timeout=15) as response:
                      return json.load(response)
              except HTTPError as exc:
                  raise SystemExit(f'{stage} rejected with HTTP {exc.code}') from None
              except Exception:
                  raise SystemExit(f'{stage}: no confirmed response') from None

          archived = read('Archived Gold preview', 'https://api.github.com/repos/arabsnipertech-bet/arabsniper2/contents/homepage.json?ref=bd6cfca33b710182967f973ed330d69508210e17', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'ArabSniperBet-GitHub-Actions'})
          preview = json.loads(b64decode(archived['content']))
          match = next(row for row in preview['gold_previews'] if row['fixture_id'] == fixture_id)
          assert preview['updated_at'].startswith('2026-11-14T06:46:27')
          assert match['kickoff'] == '2026-11-14T08:30:00+00:00'
          assert match['league'] == 'Australian Championship'
          assert match['match'] == 'Bayswater City - Sydney Olympic'
          assert any(p['market'] == 'Over 2,5 PT' and p['odd'] == 4.5
                     and p['quote_at'] == '2026-11-14T06:01:11+00:00'
                     and p['study_only'] is True for p in match['proposals'])
          result = read('Halftime score', 'https://arabsniperbet.com/api/live-scores?id=' + fixture_id)['fixtures'][fixture_id]
          assert result['status'] in {'HT', '2H', 'FT', 'AET', 'PEN'}
          assert result['halftime'] == {'home': 2, 'away': 1}

          token = os.environ['BOT_TOKEN']
          if not token:
              raise SystemExit('Telegram token unavailable')

          def telegram(method, fields):
              payload = read('Telegram ' + method, 'https://api.telegram.org/bot' + token + '/' + method, fields)
              assert payload['ok'] is True
              return payload['result']

          chat = telegram('getChat', {'chat_id': '@' + channel})
          assert chat['type'] == 'channel' and chat['username'].lower() == channel
          message = telegram('sendMessage', {
              'chat_id': '@' + channel,
              'text': os.environ['POST_TEXT'],
              'link_preview_options': '{"is_disabled":true}',
          })
          assert message['chat']['id'] == chat['id']
          print(f"Telegram publication confirmed: https://t.me/{channel}/{message['message_id']}")
          PY
