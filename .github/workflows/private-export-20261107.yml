name: Private archive size metadata
on:
  push:
    branches: ['export/private-r2-metadata-20261107']
permissions:
  contents: read
concurrency:
  group: private-r2-metadata-20261107
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install boto3 ijson==3.6.0 simplejson
      - name: Read aggregate archive sizes
        env:
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python tools/export_private_r2_20261107.py
