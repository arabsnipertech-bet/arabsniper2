name: Recover oversized night scan
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-night-storage.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: arabsniper-quote-data-writer
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Check that recovered data cannot replace newer scans
        id: guard
        shell: bash
        run: |
          if git diff --quiet fc645228d7505c23ddd84c81f402967863e01713 HEAD -- data; then
            echo 'restore=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Newer data already published; recovery skipped to preserve it.'
          fi
      - uses: actions/download-artifact@v4
        if: steps.guard.outputs.restore == 'true'
        with:
          name: scan-recovery-39534954057
          run-id: 39534954057
          github-token: ${{ github.token }}
          path: /tmp/recovered-night
      - name: Restore, pack and verify saved scan
        if: steps.guard.outputs.restore == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/recovered-night/arab_quote_dashboard.json
          cp /tmp/recovered-night/arab_quote_*.json data/
          cp -a /tmp/recovered-night/_audit_parts data/
          python src/publication_storage.py
          git add data/arab_quote_*.json data/_audit_parts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Recover complete night scan with lossless bounded storage'
            # Never force-push or reset a newer publication.
            git push origin HEAD:main
          fi
