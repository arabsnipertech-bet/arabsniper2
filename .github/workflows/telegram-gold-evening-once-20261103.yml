name: One-time confirmed evening Gold Telegram 2026-11-03
on:
  push:
    branches: [main]
    paths: ['.github/workflows/telegram-gold-evening-once-20261103.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: telegram-channel-publication
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow==11.3.0 requests==2.32.5 boto3
      - name: Select and publish one genuine fresh evening Gold
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,sys
          from pathlib import Path
          from datetime import datetime,timedelta
          from zoneinfo import ZoneInfo
          sys.path.insert(0,'src')
          from telegram_private_feed import fetch_current_private,stamp
          from telegram_digest import picks,prior_ids,evening_rationale,artifact,send,instant
          from telegram_card import draw_card
          now=datetime.now(ZoneInfo("Europe/Rome"))
          if now.date().isoformat()!='2026-11-03' or not (19<=now.hour<20):
              raise SystemExit('Outside explicit one-time pre-match publication window')
          day=now.date().isoformat()
          name=f'tg-{day}-1900'
          if artifact(name+'-claim') or artifact(name+'-sent'):
              print('ALREADY_SENT_OR_RESERVED',flush=True)
              raise SystemExit(0)
          choices=fetch_current_private(now)
          ranked=picks({'date':day,'selections':choices},now,window=('20:30','22:00'),limit=20,
                       exclude=prior_ids(day,'20:00'))
          # Prefer an existing confirmed Gold prediction with a genuinely
          # observed market quote within 4h, OCI evidence, and moderate price.
          # Do not modify the producer's actual eligibility or ranking criteria.
          qualified=[]
          for p in ranked:
              observed=stamp(p.get('provider_updated_at'))
              if (p['tier'] not in ('gold','platinum') or not observed or
                  not timedelta(0)<=now-observed<=timedelta(hours=4) or
                  not 1.40<=p['odd']<=3.50):
                  continue
              qualified.append(p)
          qualified.sort(key=lambda p:(
              p['tier']=='gold',
              p.get('market_confirmed') is True,
              p.get('oci') is not None,
              p.get('strict') is True,
              p.get('stable') is True,
              -p['odd']
          ),reverse=True)
          if not qualified:
              print('NO_FRESH_QUALIFIED_GOLD_FOR_MANUAL_EVENING',len(choices),len(ranked),flush=True)
              raise SystemExit(0)
          p=qualified[0]
          print('CHOSEN',p['id'],p['match'],p['label'],p['odd'],'TIER',p['tier'],'QUOTE_AT',p['provider_updated_at'],flush=True)
          lines=[
              f'🏆 ARABSNIPERBET · {p["tier"].upper()} · SINGOLO SERALE',
              f'⚽ {p["match"]} · ore {instant(p["kickoff"]).astimezone(ZoneInfo("Europe/Rome")):%H:%M}',
              f'🎯 {p["label"]} · quota osservata {p["odd"]:.2f}',
              '🔎 PERCHÉ SELEZIONATA:',
              *evening_rationale(p),
              '',
              'ℹ️ Selezione prepartita confermata dal modello; verifica sempre la quota disponibile.',
              '👑 https://arabsniperbet.com/gold',
              '🔞 Analisi, non garanzie. 18+.'
          ]
          txt='\n'.join(lines)
          if len(txt)>1024:
              raise SystemExit('Photo caption would be too long')
          Path('post.json').write_text(json.dumps({'picks':[p],'text':txt},ensure_ascii=False))
          draw_card({'picks':[p]},'telegram-card.png')
          send()
          print('SENT_CONFIRMED',flush=True)
          PY
      - name: Save durable confirmed receipt for 20:00 deduplication
        if: hashFiles('post.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: tg-2026-11-03-1900-sent
          path: post.json
          retention-days: 14
          if-no-files-found: error
