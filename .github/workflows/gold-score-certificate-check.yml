name: Read updated Gold score certificates
on:
  push:
    branches: [ops/gold-results-audit-20261113]
    paths: [.github/workflows/gold-score-certificate-check.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'arabsnipertech-bet/arabsniper2' && github.ref == 'refs/heads/ops/gold-results-audit-20261113'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - run: pip install 'boto3>=1.42,<2'
      - name: Confirm current production results and certificate
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_LIVE_SCORES_API_TOKEN }}
        shell: python
        run: |
          import boto3, hashlib, json, os, subprocess
          from datetime import datetime, timezone
          from urllib.request import urlopen, Request
          from urllib.parse import urlencode
          from botocore.config import Config
          ids = ('1644690','1649517','1520978','1549868','1549870','1631607')
          def emit(name, result):
              print(name, json.dumps(result, sort_keys=True), flush=True)
          curl = subprocess.run(['curl','-fsS','--max-time','12','-i',
                                 'https://arabsniperbet.com/api/live-scores'], capture_output=True, check=True)
          h, _, body = curl.stdout.rpartition(b'\r\n\r\n')
          headers = dict(line.decode().split(': ',1) for line in h.splitlines() if b': ' in line)
          live = json.loads(body)
          emit('Worker', {'checked_at':datetime.now(timezone.utc).isoformat(),
              'version':headers.get('x-live-scores-version'), 'status':live.get('status'),
              'health':live.get('health'), 'diagnostic':live.get('diagnostic'), 'cases':{i:{k:live['fixtures'].get(i,{}).get(k)
                for k in ('status','halftime','fulltime','observed_at')} for i in ids}})
          api = 'https://v3.football.api-sports.io/'
          def read(path):
              with urlopen(Request(api+path, headers={'x-apisports-key':os.environ['API_SPORTS_KEY']}), timeout=15) as response:
                  value = json.load(response)
                  if value.get('errors'):
                      raise ValueError('Provider rejected score check')
                  return value['response'], response.headers
          quota, headers = read('status')
          daily = quota['requests']['limit_day']-quota['requests']['current']
          if daily <= max(1000, (quota['requests']['limit_day']+9)//10) or headers.get('x-ratelimit-remaining') in ('0','1','2'):
              raise ValueError('Provider quota did not permit the check')
          rows, _ = read('fixtures?' + urlencode({'ids':'-'.join(ids),'timezone':'Europe/Rome'}))
          emit('Provider', {'daily_remaining':daily, 'cases':{str(r['fixture']['id']):{
              'status':r['fixture']['status']['short'], 'halftime':r['score'].get('halftime'),
              'fulltime':r['score'].get('fulltime')} for r in rows if str(r['fixture']['id']) in ids}})
          s3=boto3.client('s3',region_name='auto',
                endpoint_url='https://dfdb02b4139b31c0ab4456a50eb371a2.r2.cloudflarestorage.com',
                aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],
                config=Config(connect_timeout=5,read_timeout=18,retries={'total_max_attempts':2}))
          def raw(name):
              with s3.get_object(Bucket='arabsniper-gold',Key=name)['Body'] as stream:
                  return stream.read()
          index=json.loads(raw('state/current.json'))['files']
          name='auditarchive/prematch_2026-11-12_v7.json'
          ref=index[name]
          evidence=raw('state/objects/'+ref['sha256'])
          if len(evidence)!=ref['bytes'] or hashlib.sha256(evidence).hexdigest()!=ref['sha256']:
              raise ValueError('Auditor evidence checksum failed')
          audit=json.loads(evidence)
          emit('Auditor', {'date':audit['date'],'generated_at':audit['generated_at'],'counts':audit['counts'],
              'targets':{fid:{'status':audit['fixtures'].get(fid,{}).get('status'),
              'score':audit['fixtures'].get(fid,{}).get('result')} for fid in ids[3:]}})

          for day in range(7,14):
              name=f'auditarchive/prematch_2026-11-{day:02d}_v7.json'
              ref=index.get(name)
              if not ref:
                  emit('Day', {'date':name,'missing':True})
                  continue
              evidence=raw('state/objects/'+ref['sha256'])
              if len(evidence)!=ref['bytes'] or hashlib.sha256(evidence).hexdigest()!=ref['sha256']:
                  raise ValueError('Historical checksum failed')
              a=json.loads(evidence)
              fixtures=a.get('fixtures',{})
              emit('Day', {'date':a.get('date'),'counts':a.get('counts'),
                  'pending_ids':[fid for fid,v in fixtures.items() if v.get('status')!='settled'],
                  'triad_picks':sum(len(v.get('triad') or {}) for v in fixtures.values()),
                  'outcomes':sum(len(v.get('outcomes') or {}) for v in fixtures.values()),
                  'certified_triad_picks':sum(1 for v in fixtures.values() for pick in (v.get('triad') or {}).values()
                      if isinstance(pick,dict) and isinstance((v.get('outcomes') or {}).get(pick.get('market_id')),dict)),
                  'targets':{fid:{'status':v.get('status'),'result':v.get('result'),
                      'roles':{role:{k:((v.get('outcomes') or {}).get(pick.get('market_id')) or {}).get(k) for k in ('win','loss')}
                          for role,pick in (v.get('triad') or {}).items() if isinstance(pick,dict)}}
                      for fid,v in fixtures.items() if fid in ids}})
          cf='https://api.cloudflare.com/client/v4/accounts/dfdb02b4139b31c0ab4456a50eb371a2/workers/scripts/arabsniper-live-scores'
          def cfread(path):
              with urlopen(Request(cf+path,headers={'Authorization':'Bearer '+os.environ['CF_TOKEN']}),timeout=15) as response:
                  result=json.load(response)
                  if result.get('success') is not True: raise ValueError('Cloudflare inspection failed')
                  return result['result']
          deployments=cfread('/deployments')['deployments']
          emit('Deployments', [{'id':d.get('id'),'created_on':d.get('created_on'),'versions':d.get('versions'),'source':d.get('source')} for d in deployments[:5]])
          active=deployments[0]['versions'][0]['version_id']
          version=cfread('/versions/'+active)
          emit('Version', {'id':version.get('id'),'metadata':{k:version.get('metadata',{}).get(k) for k in ('created_on','source')},'annotations':version.get('annotations')})
          settings=cfread('/settings')
          emit('Bindings', [{'name':b.get('name'),'type':b.get('type'),'text':b.get('text') if b.get('name') in ('LIVE_ENABLED','MAX_CALLS_PER_DAY','RESERVE_REQUESTS') else None} for b in settings.get('bindings',[])])
          emit('Schedules',cfread('/schedules'))

          for vid in ('3107a825-630f-44da-b153-86577718eb15',active):
              v=cfread('/versions/'+vid)
              emit('ScriptIdentity', {'version':vid,'script':v.get('resources',{}).get('script')})

          from urllib.error import HTTPError
          try:
              account=cf.split('/workers/scripts/')[0]
              def account_read(path):
                  with urlopen(Request(account+path,headers={'Authorization':'Bearer '+os.environ['CF_TOKEN']}),timeout=15) as response:
                      value=json.load(response)
                      if value.get('success') is not True: raise ValueError('Cloudflare build read failed')
                      return value['result']
              scripts=account_read('/workers/scripts')
              script=next(s for s in scripts if s.get('id')=='arabsniper-live-scores')
              tag=script['tag']
              triggers=account_read('/builds/workers/'+tag+'/triggers')
              emit('WorkerBuildTriggers',[{k:t.get(k) for k in ('trigger_uuid','trigger_name','branch_includes','branch_excludes','path_includes','path_excludes','root_directory','deploy_command','build_command')} for t in triggers])
          except HTTPError as error:
              emit('WorkerBuildInspection',{'http_status':error.code})

          ref=index.get('data/arab_quote_usage_history.json')
          if ref:
              evidence=raw('state/objects/'+ref['sha256'])
              if hashlib.sha256(evidence).hexdigest()!=ref['sha256']: raise ValueError('Usage checksum')
              history=json.loads(evidence)
              emit('ScanUsage', {'note':history.get('note'),'runs':history.get('runs',[])[-5:]})
