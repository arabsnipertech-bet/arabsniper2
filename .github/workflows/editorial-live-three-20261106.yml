name: Three-match sports live 6 November
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/editorial-live-three-20261106.yml']
permissions:
  contents: read
concurrency:
  group: editorial-live-three-20261106
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 290
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests boto3
      - env:
          PYTHONPATH: src
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -u src/editorial_live_three_20261106.py
