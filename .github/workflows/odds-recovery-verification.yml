name: Verify real odds recovery V6-V7
on:
  workflow_dispatch:
  push:
    branches: [codex/odds-v6-v7-recovery-20261110]
    paths: ['src/odds_recovery_diagnostic.py', '.github/workflows/odds-recovery-verification.yml']
permissions:
  contents: read
concurrency:
  group: arabsniper-quote-data-writer
  cancel-in-progress: false
  queue: max
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: 09131e57e347c79246f6493d93e52f7215ff204f
          path: baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests boto3 ijson==3.6.0
      - name: Compare API, immutable checkpoint and published Gold
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BASELINE_ROOT: ${{ github.workspace }}/baseline
        working-directory: candidate
        run: python src/odds_recovery_diagnostic.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odds-recovery-evidence-${{ github.run_id }}
          path: candidate/odds-recovery-evidence/
          if-no-files-found: error
          retention-days: 30
