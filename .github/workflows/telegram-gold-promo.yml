name: Telegram Gold free trial promotion
on:
  pull_request:
    paths:
      - '.github/workflows/telegram-gold-promo.yml'
      - 'src/telegram_gold_promo.py'
      - 'tests/test_telegram_gold_promo.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: telegram-channel-publication
  cancel-in-progress: false
jobs:
  promote:
    # Retired by Publisher V7.1. Restore via the documented rollback.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify promotion schedule and one-time trial messaging
        run: python3 -m unittest discover -s tests -p test_telegram_gold_promo.py -v
