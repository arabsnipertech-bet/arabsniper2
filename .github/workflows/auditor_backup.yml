name: ArabSniper Auditor Backup

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Controlla senza avviare l’Auditor'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: write

# External cron-job.org wake-up; independent from the data-writer mutex.
concurrency:
  group: arabsniper-auditor-backup
  cancel-in-progress: false

jobs:
  check-and-wake:
    if: github.repository == 'arabsnipertech-bet/arabsniper2' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Check nightly completion and wake a missing Auditor
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUDITOR_BACKUP_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: python3 src/auditor_backup_dispatch.py
