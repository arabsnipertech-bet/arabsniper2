name: Telegram card smoke test
on:
  pull_request:
    paths:
      - 'src/telegram_card.py'
      - 'src/telegram_digest.py'
      - 'src/telegram_private_feed.py'
      - 'tests/test_telegram_private_feed.py'
      - '.github/workflows/telegram-digest.yml'
      - '.github/workflows/telegram-card-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow==11.3.0 requests==2.32.5
      - name: Verify cached Gold/Platinum selection and stale-data safeguards
        run: python3 -m unittest discover -s tests -p test_telegram_private_feed.py -v
      - name: Test real image generation with synthetic fixture inputs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,'src')
          from telegram_card import draw_card
          from PIL import Image
          for count in (1,3):
              picks=[dict(match=f'Team {i} - Team B',kickoff='2026-11-03T21:00:00+01:00',odd=1.80,label='Over 2,5 FT') for i in range(count)]
              path=draw_card(dict(picks=picks),f'/tmp/telegram-card-{count}.png')
              with Image.open(path) as image:
                  assert image.size == (1080,1350)
                  assert image.format == 'PNG'
              assert Path(path).stat().st_size > 10000
          print('Telegram photo cards rendered for singles and triples')
          PY
