name: Telegram Stripe trial security tests
on:
  pull_request:
    paths:
      - 'workers/stripe-access/telegram-trial.mjs'
      - 'workers/stripe-access/telegram-trial-schema.sql'
      - 'workers/stripe-access/worker.mjs'
      - 'workers/stripe-access/build_production.py'
      - 'tests/test_telegram_trial.mjs'
      - '.github/workflows/telegram-trial-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/test_telegram_trial.mjs
      - run: python3 workers/stripe-access/build_production.py
      - run: node --check workers/stripe-access/production-bundle.mjs
