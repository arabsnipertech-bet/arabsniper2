name: Daily editorial sports live
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/telegram-sports-live.yml', 'src/sports_daily_live.py']
permissions:
  contents: read
  actions: read
concurrency:
  group: arabsniper-sports-daily-live
  cancel-in-progress: false
jobs:
  monitor:
    # Retired by Publisher V7.1. Restore via the documented rollback.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      PYTHONPATH: src
      GH_TOKEN: ${{ github.token }}
      BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
      R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
      R2_BUCKET: arabsniper-gold
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install boto3 requests
      - run: python -u src/sports_daily_live.py monitor
