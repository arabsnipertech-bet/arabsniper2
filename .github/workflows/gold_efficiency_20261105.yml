name: Gold efficiency snapshots 5 November
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/gold_efficiency_20261105.yml']
  schedule:
    - cron: '30 11 5 11 *'
    - cron: '0 14,17,19 5 11 *'
permissions:
  contents: read
concurrency:
  group: gold-efficiency-snapshots-20261105
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
      R2_BUCKET: arabsniper-gold
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install boto3 ijson==3.6.0
      - name: Capture current checkpoint and archived publication records
        shell: python
        run: |
          import hashlib, json, os, re, sys
          from collections import Counter
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import ijson
          sys.path.insert(0, 'src')
          from gold_storage import client, allowed
          from audit_storage import read_store, open_verified_json, FORMAT
          
          now = datetime.now(ZoneInfo('Europe/Rome'))
          if now.date().isoformat() != '2026-11-05':
              print('One-day observation finished')
              sys.exit(0)
          s3 = client()
          bucket = os.environ['R2_BUCKET']
          prefix = 'diagnostics/gold-efficiency/2026-11-05/'
          raw_manifest = s3.get_object(Bucket=bucket, Key='state/current.json')['Body'].read()
          manifest = json.loads(raw_manifest)
          assert manifest['version'] == 1
          files = manifest['files']
          root = Path('/tmp/gold-efficiency')
          root.mkdir(exist_ok=True)
          
          def download(name):
              assert allowed(name)
              item = files[name]
              raw = s3.get_object(Bucket=bucket, Key='state/objects/'+item['sha256'])['Body'].read()
              assert len(raw) == item['bytes'] and hashlib.sha256(raw).hexdigest() == item['sha256']
              path = root/name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(raw)
              if name.endswith('.json') and len(raw) < 1048576:
                  value = json.loads(raw)
                  if value.get('_storage') == FORMAT:
                      for part in value['parts']:
                          download(str(Path(name).parent/'_audit_parts'/(part['sha256']+'.json.gz')))
              return path
          
          feeds = {}
          for name in sorted(files):
              if re.fullmatch(r'data/arab_quote_day[1-5].json', name):
                  feeds[name] = read_store(download(name))
          if len(feeds) != 5:
              raise ValueError('Incomplete Gold checkpoint')
          stamp = now.strftime('%H%M%S')
          s3.put_object(Bucket=bucket, Key=prefix+stamp+'-snapshot.json',
              Body=json.dumps({'observed_at':now.isoformat(), 'checkpoint_sha256':hashlib.sha256(raw_manifest).hexdigest(),
              'feeds':feeds},ensure_ascii=False).encode(), ContentType='application/json')
          matches = {}
          for feed in feeds.values():
              for match in feed.get('matches', []):
                  meta = match.get('fixture') or {}
                  matches[str(meta.get('fixture_id'))] = match
          current = Counter()
          for match in matches.values():
              meta = match.get('fixture') or {}
              if str(meta.get('kickoff',''))[:10] != '2026-11-05':
                  continue
              current['partite_oggi'] += 1
              current['stato_'+str(meta.get('status_short'))] += 1
              rows = ((match.get('multimarket') or {}).get('matrix') or {}).get('rows', [])
              for row in rows:
                  current['righe_quote_'+str(row.get('quote_status'))] += 1
          summary = {'captured_at':now.isoformat(), 'current':dict(current),
              'feed_timestamps':{k:{f:v.get(f) for f in ('date','updated_at','generated_at')} for k,v in feeds.items()}}
          
          # Use the production frontend selector at the original observation time.
          import subprocess
          def normalize(snapshot, label):
              path = root/(label+'.json')
              path.write_text(json.dumps(snapshot))
              return json.loads(subprocess.check_output(['node','-e',"const fs=require('fs');\nconst snap=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));\nconst Clock=Date,when=Clock.parse(snap.observed_at);\nglobal.Date=class extends Clock{constructor(...args){super(...(args.length?args:[when]));}static now(){return when;}};\nconst api=require(process.cwd()+'/web/lateral-matrix.js');\nconst result={};\nfor(const feed of Object.values(snap.feeds)){\n for(const m of api.scopePayload(feed).matches||[]){\n  const f=m.fixture||{};\n  if(!f.kickoff || new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Rome'}).format(new Clock(f.kickoff))!=='2026-11-05')continue;\n  const rows=api.rowsOf(m),tier=api.cockpitTier(m);\n  const radar=api.marketSignals(rows,{now:when,archived:api.phase(m)!=='upcoming'});\n  result[String(f.fixture_id)]={home:f.home,away:f.away,kickoff:f.kickoff,status:f.status_short,\n    category:tier.tone==='studio'&&radar.length?'radar':tier.tone,\n    proposal:tier.row?.id||null,\n    rows:Object.fromEntries(rows.map(r=>[JSON.stringify([r.spec,r.bookmaker_id??r.bookmaker??null,r.id]),\n      {odd:r.odd,updated:r.provider_updated_at,observed:r.quote_observed_at,status:r.quote_status}]))};\n }\n}\nprocess.stdout.write(JSON.stringify(result));",str(path)],text=True))
          snapshot = {'observed_at':now.isoformat(),'feeds':feeds}
          normalized = normalize(snapshot,'current')
          summary['matches'] = [{k:v for k,v in m.items() if k!='rows'} for m in normalized.values()]
          summary['categories'] = dict(Counter(m['category'] for m in normalized.values()))
          summary['current'] = {'partite_oggi':len(normalized),'statuses':dict(Counter(m['status'] for m in normalized.values()))}
          summary['current']['quote_statuses'] = dict(Counter(row['status'] for m in normalized.values() for row in m['rows'].values()))
          prior_keys = sorted(obj['Key'] for page in s3.get_paginator('list_objects_v2').paginate(Bucket=bucket,Prefix=prefix)
                              for obj in page.get('Contents',[]) if obj['Key'].endswith('-snapshot.json') and obj['Key'] < prefix+stamp+'-snapshot.json')
          if prior_keys:
              baseline = json.loads(s3.get_object(Bucket=bucket,Key=prior_keys[0])['Body'].read())
              previous = normalize(baseline,'baseline')
              changes = Counter()
              changed_matches = []
              for fid in normalized.keys() & previous.keys():
                  old,new = previous[fid],normalized[fid]
                  if datetime.fromisoformat(new['kickoff']) <= now:
                      continue
                  changes['comparable_prematch_matches'] += 1
                  flags = set()
                  for key in old['rows'].keys() & new['rows'].keys():
                      before,after = old['rows'][key],new['rows'][key]
                      if before.get('odd') is None and after.get('odd') is not None:
                          flags.add('quotes_arrived')
                      if before.get('odd') is not None and after.get('odd') is not None and before['odd'] != after['odd']:
                          flags.add('price_changed')
                      if after.get('updated') and before.get('updated') and datetime.fromisoformat(after['updated']) > datetime.fromisoformat(before['updated']):
                          flags.add('provider_updated')
                  if any(row.get('odd') is not None for key,row in new['rows'].items() if key not in old['rows']):
                      flags.add('quotes_arrived')
                  if new['category'] != old['category']:
                      flags.add('category_changed')
                  if new['proposal'] != old['proposal']:
                      flags.add('proposal_changed')
                  changes.update(flags)
                  if flags:
                      changed_matches.append({'fixture_id':fid,'home':new['home'],'away':new['away'],'changes':sorted(flags)})
              summary['comparison'] = {'baseline_at':baseline['observed_at'],'counts':dict(changes),'matches':changed_matches}
          print('GOLD_EFFICIENCY_CURRENT '+json.dumps(summary),flush=True)
          
          
          summary['history_exports'] = [obj['Key'] for page in s3.get_paginator('list_objects_v2').paginate(Bucket=bucket,Prefix=prefix)
              for obj in page.get('Contents',[]) if obj['Key'].endswith('-history.jsonl')]
          s3.put_object(Bucket=bucket, Key=prefix+stamp+'-summary.json',Body=json.dumps(summary).encode(),ContentType='application/json')
          print('GOLD_EFFICIENCY_SUMMARY '+json.dumps(summary),flush=True)
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('## Gold efficiency snapshot\n\n'+json.dumps(summary,indent=2))
          
