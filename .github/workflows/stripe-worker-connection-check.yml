name: Verifica collegamento stripe-checker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/stripe-worker-connection-check.yml]
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verifica API Cloudflare in sola lettura
        shell: python
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_STRIPE_WORKER_API_TOKEN }}
          D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          import os, json, urllib.request, urllib.error
          token = os.environ.get("CF_TOKEN", "")
          if not token:
              raise SystemExit("Secret CLOUDFLARE_STRIPE_WORKER_API_TOKEN assente o vuoto.")
          base = "https://api.cloudflare.com/client/v4/accounts/dfdb02b4139b31c0ab4456a50eb371a2"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          client = urllib.request.build_opener(NoRedirect())
          def read(path):
              req = urllib.request.Request(base + path, headers={"Authorization": "Bearer " + token})
              try:
                  with client.open(req, timeout=30) as response:
                      result = json.load(response)
              except urllib.error.HTTPError as e:
                  print("GET " + path + ": HTTP " + str(e.code))
                  return None
              except Exception:
                  print("GET " + path + ": risposta non verificabile")
                  return None
              if not result.get("success"):
                  print("GET " + path + ": richiesta non confermata")
                  return None
              return result.get("result")
          settings = read("/workers/scripts/stripe-checker/settings")
          if settings is None:
              raise SystemExit("Accesso alle impostazioni Worker non verificato. Nessuna modifica effettuata.")
          print("Accesso alle impostazioni stripe-checker: OK")
          print("compatibility_date:", settings.get("compatibility_date"))
          print("compatibility_flags:", settings.get("compatibility_flags", []))
          for b in settings.get("bindings", []):
              safe = {k: b[k] for k in ("name", "type", "id", "bucket_name") if k in b}
              print("Binding:", json.dumps(safe))
          token = os.environ.get("D1_TOKEN", "")
          if not token:
              raise SystemExit("Secret CLOUDFLARE_D1_API_TOKEN assente o vuoto.")
          db = read("/d1/database/2f9dbeae-4b26-494d-9b88-a3a89a1c4f25")
          print("Lettura metadati D1:", "OK" if db is not None else "NON DISPONIBILE con questo token")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("Worker stripe-checker: lettura impostazioni riuscita.\n\n")
              out.write("D1: " + ("lettura metadati riuscita" if db is not None else "permesso non verificato") + ".\n\n")
              out.write("Nessun deploy, nessuna modifica ai dati, nessun messaggio inviato.\n")
          if db is None:
              raise SystemExit("Token D1 non verificato.")
          sql = "SELECT status, COUNT(*) AS total FROM telegram_trial_claims GROUP BY status"
          req = urllib.request.Request(base + "/d1/database/2f9dbeae-4b26-494d-9b88-a3a89a1c4f25/query",
              data=json.dumps({"sql": sql}).encode(),
              headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"}, method="POST")
          try:
              with client.open(req, timeout=30) as response:
                  result = json.load(response)
              if not result.get("success"):
                  raise ValueError()
          except Exception:
              raise SystemExit("Query D1 di sola lettura non riuscita.")
          print("Registro prove (conteggi aggregati):", json.dumps(result["result"][0]["results"]))
          import hashlib, email.parser, email.policy
          token = os.environ["CF_TOKEN"]
          req = urllib.request.Request(base + "/workers/scripts/stripe-checker/content/v2", headers={"Authorization": "Bearer " + token})
          with client.open(req, timeout=30) as response:
              raw = response.read()
              ct = response.headers.get("Content-Type", "")
          if "multipart/" in ct:
              msg = email.parser.BytesParser(policy=email.policy.default).parsebytes(("Content-Type: " + ct + "\r\nMIME-Version: 1.0\r\n\r\n").encode() + raw)
              parts = [(p.get_param("name", header="content-disposition"), p.get_payload(decode=True)) for p in msg.iter_parts()]
          else:
              parts = [("worker.js", raw)]
          for name, data in parts:
              if not data:
                  continue
              print("Live module:", name, "bytes:", len(data), "SHA256:", hashlib.sha256(data).hexdigest())
              code = data.decode("utf-8")
              root = "https://raw.githubusercontent.com/arabsnipertech-bet/arabsniper2/cb8ee1887ce17665b83024e57a3e404e44f1ff58/workers/stripe-access/"
              with urllib.request.urlopen(root + "production-bundle.mjs", timeout=30) as response:
                  bundle = response.read().decode()
              with urllib.request.urlopen(root + "telegram-trial.mjs", timeout=30) as response:
                  trial = response.read().decode().replace("export ", "")
              print("Matches repository bundle:", code.strip() == bundle.strip())
              print("Exact Telegram module occurrences:", code.count(trial))
              print("Renewal module present:", "function renewalStatus(" in code)
