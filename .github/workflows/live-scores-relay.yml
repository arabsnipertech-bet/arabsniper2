name: Recover official live scores
on:
  workflow_dispatch:
    inputs:
      restore_primary:
        description: Riporta il recupero degli esiti Gold su arabsniper2
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: arabsniper-live-scores-relay
  cancel-in-progress: false
jobs:
  recover:
    if: github.repository == 'arabsnipertech-bet/arabsniper2' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            .github/ops
            src
            data/live_watchlist.json
      - run: pip install 'boto3>=1.42,<2' 'requests>=2.32,<3' ijson==3.6.0
      - name: Restore the primary repository as owner
        if: inputs.restore_primary
        env:
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m gold_results_handoff restore-primary
      - name: Recover only tracked missing or stale scores
        id: relay
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GOLD_RELAY_FOLLOWUP: 'true'
        run: python3 .github/ops/live-scores-relay.py
      - name: Recover live scores between Fast Backup runs
        if: ${{ !cancelled() && steps.relay.outputs.live_followup == 'true' }}
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          sleep 300
          python3 .github/ops/live-scores-relay.py
