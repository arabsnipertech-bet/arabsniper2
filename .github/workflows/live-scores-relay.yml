name: Recover official live scores
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/ops/live-scores-relay.py'
      - '.github/workflows/live-scores-relay.yml'
permissions:
  contents: read
concurrency:
  group: arabsniper-live-scores-relay
  cancel-in-progress: false
jobs:
  recover:
    if: github.repository == 'arabsnipertech-bet/arabsniper2' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            .github/ops
            data/live_watchlist.json
      - run: pip install 'boto3>=1.42,<2'
      - name: Recover only tracked missing or stale scores
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python3 .github/ops/live-scores-relay.py
