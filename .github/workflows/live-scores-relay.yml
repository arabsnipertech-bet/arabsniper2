name: Recover official live scores
on:
  workflow_dispatch:
  workflow_run:
    workflows: [ArabSniper Fast Backup]
    branches: [main]
    types: [completed]
  schedule:
    - cron: '2-57/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/ops/live-scores-relay.py'
      - '.github/workflows/live-scores-relay.yml'
permissions:
  contents: read
concurrency:
  group: arabsniper-live-scores-relay
  cancel-in-progress: false
jobs:
  recover:
    if: github.repository == 'arabsnipertech-bet/arabsniper2' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            .github/ops
            data/live_watchlist.json
      - run: pip install 'boto3>=1.42,<2'
      - name: Recover only tracked missing or stale scores
        id: relay
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python3 .github/ops/live-scores-relay.py
      - name: Recover live scores between Fast Backup runs
        if: ${{ !cancelled() && github.event_name == 'workflow_run' && steps.relay.outputs.live_followup == 'true' }}
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          sleep 250
          python3 .github/ops/live-scores-relay.py
