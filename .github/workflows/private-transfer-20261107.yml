name: Transfer encrypted private export in bounded blocks
on:
  push:
    branches: ['export/private-r2-transfer-20261107']
permissions:
  contents: read
  actions: read
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: private-r2-encrypted-20261107
          run-id: 42350681144
          github-token: ${{ github.token }}
          path: incoming
      - name: Split ciphertext only
        run: |
          mkdir parts
          split -b 400M -d -a 2 incoming/ArabSniper_Archivio_R2.zip.enc parts/part-
          python - <<'PY'
          import hashlib,json,pathlib
          rows=[]
          for p in sorted(pathlib.Path('parts').glob('part-*')):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(1048576),b''):h.update(b)
              rows.append({'name':p.name,'bytes':p.stat().st_size,'sha256':h.hexdigest()})
          assert len(rows)==21
          pathlib.Path('transfer-index.json').write_text(json.dumps(rows,indent=2))
          print('Verified encrypted transfer parts:',len(rows))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: private-export-part-00
          path: parts/part-00
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: private-export-part-01
          path: parts/part-01
          retention-days: 1
          compression-level: 0
