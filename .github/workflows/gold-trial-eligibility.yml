name: Deploy permanent Gold trial eligibility
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gold-trial-eligibility.yml'
      - 'scripts/deploy-trial-eligibility.py'
permissions:
  contents: read
concurrency:
  group: stripe-checker-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            workers/stripe-access
            tests
            scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Trial eligibility and paid renewal regression tests
        run: node --test tests/test_telegram_trial.mjs tests/test_gold_renewal.mjs
      - name: Install private backup client
        run: pip install 'boto3>=1.42,<2'
      - name: Deploy and verify trial module only
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_STRIPE_WORKER_API_TOKEN }}
          D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/deploy-trial-eligibility.py
