name: Publish verified successes 5 November
on:
  push:
    branches: [main]
    paths: ['.github/workflows/send-verified-20261105.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: telegram-prediction-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests boto3 Pillow==11.3.0
      - name: Download verified evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 42213918472 -n verified-gold-20261105 -D verified
      - name: Recheck final scores and send once
        env:
          PYTHONPATH: src
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python src/send_verified_20261105.py
      - uses: actions/upload-artifact@v4
        with:
          name: telegram-verified-20261105-sent
          path: |
            receipt.json
            verified-card.jpg
          retention-days: 90
