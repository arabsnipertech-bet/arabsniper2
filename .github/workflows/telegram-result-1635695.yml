name: Telegram result Manchester United-Roma 2026-11-03
on:
  push:
    branches: [main]
    paths: ['.github/workflows/telegram-result-1635695.yml']
permissions:
  contents: read
  actions: read
concurrency: telegram-channel-publication
jobs:
  publish:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'Publish verified Manchester United–Roma Telegram result once'
    runs-on: ubuntu-latest
    steps:
      - name: Check original sent selection and prevent duplicate recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(TZ=Europe/Rome date +%F)" = 2026-11-04
          for name in tg-settled-1635695-over35-claim telegram-evidence-2026-11-04-audit-sent; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name" --jq .total_count)
            test "$count" = 0
          done
          gh run download 41700003201 --repo "$GITHUB_REPOSITORY" -n tg-2026-11-03-2000-sent -D original
          jq -e 'any(.picks[]; (.id|tostring)=="1635695" and .market=="over35_ft" and .odd==2.25)' original/post.json
      - uses: actions/upload-artifact@v4
        with:
          name: tg-settled-1635695-over35-claim
          path: original/post.json
      - name: Publish verified result
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          content = "✅ CASSA GOLD · Champions League\n\nManchester United 3–2 Roma\n🎯 Over 3,5 gol FT asiatico · quota osservata 2,25\n\nCinque gol al fischio finale. Il singolo Gold pubblicato ieri sera prima del calcio d’inizio è vincente.\n\nFonte risultato: UEFA · 3 novembre 2026"
          body = json.dumps({"chat_id":"@arabsniper_signals","text":content}).encode()
          request = urllib.request.Request("https://api.telegram.org/bot"+os.environ["TOKEN"]+"/sendMessage",data=body,headers={"Content-Type":"application/json"})
          with urllib.request.urlopen(request, timeout=25) as response:
              result = json.load(response)
          if not result.get("ok"):
              raise RuntimeError("Telegram send not confirmed")
          print("Confirmed Telegram message", result["result"]["message_id"])
          PY
