name: Selection policy tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/gold-history.yml'
      - '.github/workflows/live-scores-health.yml'
      - '.github/workflows/live-scores-relay.yml'
      - 'src/**'
      - 'tests/**'
      - 'auditor/current_audit.py'
      - 'auditor/recover_daily.py'
      - 'auditor/repair_calibration.py'
      - 'auditor/repair_certificate.py'
      - '.github/workflows/repair-learning-chain.yml'
      - '.github/workflows/recover-daily-results.yml'
      - '.github/workflows/policy_tests.yml'
      - '.github/workflows/night_scan_backup.yml'
      - '.github/workflows/fast_scan_backup.yml'
      - '.github/workflows/auditor_backup.yml'
      - '.github/workflows/fast_scan.yml'
      - '.github/workflows/run-auditor.yml'
      - '.github/workflows/freeze-audit-source.yml'
      - '.github/workflows/night_scan.yml'
      - 'web/gold-dashboard-live.html'
      - 'web/index.html'
      - 'web/vendor/**'
      - 'web/homepage.js'
      - 'web/competition-scope.js'
      - 'web/lateral-matrix.js'
      - 'web/lateral-matrix.css'
      - 'web/statistics-first.js'
      - 'web/statistics-first.css'
      - 'web/results.js'
      - 'web/live-scores.js'
      - 'workers/stripe-access/**'
      - 'web/gold-explorer*'
      - 'web/explorer-core.mjs'
      - 'web/explorer-loader.mjs'
      - 'workers/live-scores/**'
  push:
    branches: [main]
    paths: ['web/explorer-loader.mjs', 'web/gold-explorer*', 'web/vendor/**', '.github/workflows/gold-history.yml', '.github/workflows/live-scores-health.yml', '.github/workflows/live-scores-relay.yml', 'src/**', 'tests/**', 'auditor/current_audit.py', 'auditor/recover_daily.py', 'auditor/repair_calibration.py', 'auditor/repair_certificate.py', '.github/workflows/repair-learning-chain.yml', '.github/workflows/recover-daily-results.yml', 'web/gold-dashboard-live.html', 'web/live-scores.js', 'web/index.html', 'web/homepage.js', 'web/competition-scope.js', 'web/statistics-first.js', 'web/statistics-first.css', 'web/lateral-matrix.js', 'web/lateral-matrix.css', 'web/results.js', '.github/workflows/policy_tests.yml', '.github/workflows/night_scan_backup.yml', '.github/workflows/auditor_backup.yml', '.github/workflows/run-auditor.yml', 'workers/live-scores/**']
permissions:
  contents: read
jobs:
  reconcile-cached-v7-results:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[v7-cached-results-reconcile]')
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    concurrency:
      group: arabsniper-quote-data-writer
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install boto3 requests ijson==3.6.0
      - name: Reconcile cached results with frozen forecasts and weights protected
        env:
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GOLD_PRIVATE: 'true'
          PYTHONUNBUFFERED: '1'
        run: python scripts/reconcile-cached-v7-results.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cached-v7-reconciliation
          path: test-artifacts/cached-v7-reconciliation.json
          retention-days: 30
          if-no-files-found: error

  explorer-current-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, '[explorer-current-pages]') || contains(github.event.head_commit.message, '[compact-choice-facts]'))
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: arabsniper-explorer-current-index
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install boto3 requests ijson==3.6.0
      - name: Index current Explorer pages and verify identical rows
        env:
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python ${{ contains(github.event.head_commit.message, '[compact-choice-facts]') && 'scripts/explorer-compact-facts.py' || 'scripts/explorer-current-pages.py' }}

  explorer-current-pages-after-scan:
    # One release-only check after an older scan: its old publisher can replace
    # the current projection. No recurring workflow or provider collection.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, '[explorer-current-pages]') || contains(github.event.head_commit.message, '[compact-choice-facts]'))
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: arabsniper-quote-data-writer
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install boto3 requests ijson==3.6.0
      - name: Verify current page layout after any older scan
        env:
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python ${{ contains(github.event.head_commit.message, '[compact-choice-facts]') && 'scripts/explorer-compact-facts.py' || 'scripts/explorer-current-pages.py' }}

  gold-explorer-loading-profile:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'arabsnipertech-bet/arabsniper2' && github.event.pull_request.head.ref == 'fix/gold-selection-reasons-loading-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install boto3 requests ijson==3.6.0
      - name: Measure payloads without writes or provider calls
        env:
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/gold-loading-profile.py

  selection-release-storage-preflight:
    # Read-only check of the pre-existing Fast restore failure, for this release only.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'arabsnipertech-bet/arabsniper2' && github.event.pull_request.head.ref == 'fix/gold-selection-clarity-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install boto3 ijson==3.6.0 requests
      - name: Verify the exact checkpoint object that blocked the previous Fast
        env:
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        shell: python
        run: |
          import json, os, re, sys
          sys.path.insert(0, 'src')
          from gold_storage import client, previous_manifest, read_checkpoint_object, sha
          storage, bucket = client(fast_restore=True), os.environ['R2_BUCKET']
          index = previous_manifest(storage, bucket)
          path = 'data/arab_quote_price_history_20261122_5.json'
          if path not in index:
              print(json.dumps({'status':'pointer_no_longer_in_current_manifest','writes':0}))
              raise SystemExit(0)
          info = index[path]
          try:
              raw = read_checkpoint_object(storage, bucket, 'state/objects/'+info['sha256'])
          except Exception as error:
              response = getattr(error, 'response', {})
              code = str(response.get('Error', {}).get('Code', 'unknown'))
              code = code if re.fullmatch(r'[A-Za-z0-9_-]{1,50}', code) else 'unknown'
              print(json.dumps({'status':'read_failed','type':type(error).__name__,
                    'code':code,'http':response.get('ResponseMetadata', {}).get('HTTPStatusCode'),'writes':0}))
              raise SystemExit(1)
          valid = len(raw)==info['bytes'] and sha(raw)==info['sha256']
          print(json.dumps({'status':'verified' if valid else 'checksum_mismatch','writes':0}))
          raise SystemExit(0 if valid else 1)

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests ijson==3.6.0 cryptography 'Pillow>=11,<13' 'PyNaCl>=1.5,<2'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile src/3appdays.py src/policy_integration.py src/statistics_first.py src/statistics_integration.py src/lateral_matrix.py src/matrix_quotes.py src/matrix_pipeline.py src/matrix_audit.py src/selection_policy.py src/prematch_audit.py src/first_half_quality.py src/filter_audit.py src/multimarket_model.py src/context_analysis.py src/analysis_history.py src/multimarket_audit.py src/model_research.py src/signal_research.py auditor/current_audit.py
      - name: Run every Node test file
        run: |
          for test in tests/test_*.js tests/test_*.cjs tests/test_*.mjs; do
            node "$test" || exit 1
          done

      - name: Prepare browser for dashboard checks
        timeout-minutes: 10
        run: |
          npm install --prefix /tmp/arabsniper-browser playwright@1.62.1
          browser=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$browser" ]; then
            "$browser" --version
            printf '%s\n' "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser" "CHROMIUM_PATH=$browser" >> "$GITHUB_ENV"
          else
            /tmp/arabsniper-browser/node_modules/.bin/playwright install --with-deps chromium
          fi
      - name: Check dashboard in desktop and mobile browser
        run: NODE_PATH=/tmp/arabsniper-browser/node_modules node tests/browser_dashboard.cjs
      - name: Check statistics-first dashboard
        run: NODE_PATH=/tmp/arabsniper-browser/node_modules node tests/browser_statistics_first.cjs
      - name: Check universal lateral matrix dashboard
        run: NODE_PATH=/tmp/arabsniper-browser/node_modules node tests/browser_lateral_matrix.cjs
      - name: Check public Publisher on desktop and mobile
        run: NODE_PATH=/tmp/arabsniper-browser/node_modules node tests/browser_publisher_v71.cjs
      - name: Check Gold Explorer
        run: NODE_PATH=/tmp/arabsniper-browser/node_modules node tests/browser_gold_explorer.cjs
      - name: Check V7 qualifications in desktop and mobile browser
        run: NODE_PATH=/tmp/arabsniper-browser/node_modules node tests/browser_v7_confirmation.cjs
      - name: Save dashboard previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-dashboard-previews
          path: test-artifacts/
          if-no-files-found: ignore


  explorer-card-context-refresh:
    # One presentation-only publication after the explicitly marked release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[explorer-card-context]')
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: arabsniper-quote-data-writer
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install boto3 ijson==3.6.0 requests
      - name: Publish Explorer quotes and explanations from saved Gold snapshots
        env:
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python src/explorer_card_context_refresh.py

  explorer-real-preflight:
    # Narrowly scoped to the owner-authored Explorer PR; never forks or other PRs.
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 220 && github.event.pull_request.head.repo.full_name == 'arabsnipertech-bet/arabsniper2' && github.event.pull_request.head.ref == 'feature/gold-explorer-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch only the production baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install boto3 requests ijson==3.6.0
      - name: Read private Gold and Cloudflare; project locally without remote writes
        env:
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_STRIPE_WORKER_API_TOKEN }}
          D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: python scripts/explorer-readonly-preflight.py
      - uses: actions/upload-artifact@v4
        with:
          name: explorer-real-preflight-aggregates
          path: test-artifacts/explorer-real-preflight.json
          retention-days: 3
          if-no-files-found: error

  explorer-authorized-release:
    # Bruno authorized merge/deploy in chat. One-shot marker prevents later runs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release-explorer-v1]')
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    concurrency:
      group: gold-explorer-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install boto3 requests ijson==3.6.0
      - name: Deploy Explorer from existing archives without football calls
        env:
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_STRIPE_WORKER_API_TOKEN }}
          D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: python scripts/deploy-gold-explorer.py
      - name: Prepare live browser verification
        run: npm install --prefix /tmp/arabsniper-browser playwright@1.62.1
      - name: Verify live API and owner interface
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_STRIPE_WORKER_API_TOKEN }}
          D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          NODE_PATH: /tmp/arabsniper-browser/node_modules
        run: python scripts/explorer-online-smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: explorer-release-report
          path: test-artifacts/explorer-*.json
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: explorer-live-screenshots
          path: test-artifacts/explorer-live-*.png
          retention-days: 30
          if-no-files-found: error

  cancel-superseded-explorer-release:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'arabsnipertech-bet/arabsniper2' && github.event.pull_request.head.ref == 'fix/explorer-release-isolation'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancel only the superseded pending Explorer release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import os,json,urllib.request
          base='https://api.github.com/repos/arabsnipertech-bet/arabsniper2/actions/runs/44051059081'
          def call(url,method='GET'):
              req=urllib.request.Request(url,method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r) if method=='GET' else None
          run=call(base)
          assert run['head_sha']=='d5ff9b9bee0f5d4c43bd31e05bc41a062e24f4f2'
          if run['status']!='completed':
              jobs=call(base+'/jobs')['jobs']
              pending=[j for j in jobs if j['name']=='explorer-authorized-release']
              assert len(pending)==1 and pending[0]['status'] in ('queued','pending','waiting'), 'Release already running; do not cancel'
              assert all(j['status']=='completed' or j['name']=='explorer-authorized-release' for j in jobs)
              call(base+'/cancel','POST')
          print('Superseded Explorer release cancelled or already complete; no Night/Fast job touched')

  explorer-post-release-verification:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[explorer-verify]')
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: npm install --prefix /tmp/arabsniper-browser playwright@1.62.1
      - name: Verify live Explorer including seven-day history
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_STRIPE_WORKER_API_TOKEN }}
          D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          NODE_PATH: /tmp/arabsniper-browser/node_modules
        run: python scripts/explorer-online-smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: explorer-online-final-verification
          path: test-artifacts/explorer-live-*
          retention-days: 30
          if-no-files-found: error

  explorer-release-progress:
    # Read-only aggregate diagnostics for this owner-authored release PR only.
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 222 && github.event.pull_request.head.repo.full_name == 'arabsnipertech-bet/arabsniper2' && github.event.pull_request.head.ref == 'fix/explorer-onboarding-smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install boto3 requests ijson==3.6.0
      - name: Read Explorer progress without writes or provider access
        env:
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_STRIPE_WORKER_API_TOKEN }}
        run: |
          python - <<'PYTHON'
          import sys, os, json
          sys.path.insert(0,'src')
          from gold_storage import client, previous_manifest
          from gold_explorer import read
          from pathlib import Path
          s3=client();bucket=os.environ['R2_BUCKET']
          catalog=read(s3,bucket,'explorer/catalog.json',{})
          current=read(s3,bucket,'explorer/current.json',{})
          lease=read(s3,bucket,'explorer/writer-lease.json',{})
          manifest=previous_manifest(s3,bucket)
          legacy=[p for p in manifest if p.startswith('auditordata/prematch_') and p.endswith('.json') and len(Path(p).stem)==19]
          report={'current_rows':current.get('count'),'updated_at':catalog.get('updated_at'),'days':len(catalog.get('days',{})), 'legacy_archives_total':len(legacy), 'legacy_days_imported':sum('legacy_sha' in d for d in catalog.get('days',{}).values()), 'legacy_rows_imported':sum(d.get('legacy_count',0) for d in catalog.get('days',{}).values()),'results':sum(d.get('results',0) for d in catalog.get('days',{}).values()),'lease_expires_at':lease.get('expires_at'),'writes':0,'football_requests':0}
          import importlib.util
          spec=importlib.util.spec_from_file_location('release','scripts/deploy-gold-explorer.py');release=importlib.util.module_from_spec(spec);spec.loader.exec_module(release)
          live=release.ops.live();settings=release.ops.cf(release.ops.WORKER+'/settings',os.environ['CF_TOKEN'])
          report['worker_sha']=release.ops.digest(live)
          report['explorer_flag_present']=any(b.get('name')=='GOLD_EXPLORER_ENABLED' for b in settings['bindings'])
          print(json.dumps(report,indent=2))
          PYTHON

  explorer-finalize-release:
    # Bruno authorized merge/deploy in chat. One-shot marker prevents later runs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[activate-explorer-v1]')
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: gold-explorer-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install boto3 requests ijson==3.6.0
      - name: Activate exact verified Worker after propagation
        env:
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_STRIPE_WORKER_API_TOKEN }}
          D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: python scripts/activate-gold-explorer.py
      - name: Prepare live browser verification
        run: npm install --prefix /tmp/arabsniper-browser playwright@1.62.1
      - name: Verify live API and owner interface
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_STRIPE_WORKER_API_TOKEN }}
          D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          NODE_PATH: /tmp/arabsniper-browser/node_modules
        run: python scripts/explorer-online-smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: explorer-release-report
          path: test-artifacts/explorer-*.json
          retention-days: 30
