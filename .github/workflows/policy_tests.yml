name: Selection policy tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'auditor/current_audit.py'
      - '.github/workflows/policy_tests.yml'
      - 'web/gold-dashboard-live.html'
      - 'web/index.html'
      - 'web/homepage.js'
      - 'web/lateral-matrix.js'
      - 'web/lateral-matrix.css'
      - 'web/statistics-first.js'
      - 'web/statistics-first.css'
      - 'web/results.js'
      - 'web/live-scores.js'
      - 'workers/live-scores/**'
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'auditor/current_audit.py', 'web/gold-dashboard-live.html', 'web/live-scores.js', 'web/index.html', 'web/homepage.js', 'web/statistics-first.js', 'web/statistics-first.css', 'web/lateral-matrix.js', 'web/lateral-matrix.css', 'web/results.js', '.github/workflows/policy_tests.yml', 'workers/live-scores/**']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests ijson==3.6.0
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile src/3appdays.py src/policy_integration.py src/statistics_first.py src/statistics_integration.py src/lateral_matrix.py src/matrix_quotes.py src/matrix_pipeline.py src/matrix_audit.py src/selection_policy.py src/prematch_audit.py src/first_half_quality.py src/filter_audit.py src/multimarket_model.py src/context_analysis.py src/analysis_history.py src/multimarket_audit.py src/model_research.py src/signal_research.py auditor/current_audit.py
      - name: Check public homepage and verified results
        run: |
          node tests/test_homepage.js
          node tests/test_results.js
      - run: node tests/test_dashboard.js
      - run: node tests/test_statistics_first.js
      - run: node tests/test_lateral_matrix.js
      - run: node tests/test_storage_loader.cjs
      - run: node --test tests/test_live_scores.mjs


      - name: Install browser for dashboard checks
        timeout-minutes: 10
        run: |
          # The hosted Azure mirror can stall large font downloads. Keep the
          # Ubuntu archive/signature checks and bound network retries.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-arabsniper-timeouts >/dev/null
          npm install --prefix /tmp/arabsniper-browser playwright@1.62.1
          /tmp/arabsniper-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Check dashboard in desktop and mobile browser
        run: NODE_PATH=/tmp/arabsniper-browser/node_modules node tests/browser_dashboard.cjs
      - name: Check statistics-first dashboard
        run: NODE_PATH=/tmp/arabsniper-browser/node_modules node tests/browser_statistics_first.cjs
      - name: Check universal lateral matrix dashboard
        run: NODE_PATH=/tmp/arabsniper-browser/node_modules node tests/browser_lateral_matrix.cjs
      - name: Save dashboard previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-dashboard-previews
          path: test-artifacts/
          if-no-files-found: ignore
