name: Selection policy tests
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/policy_tests.yml'
      - 'web/gold-dashboard-live.html'
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'web/gold-dashboard-live.html']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile src/3appdays.py src/policy_integration.py src/selection_policy.py src/prematch_audit.py src/first_half_quality.py src/filter_audit.py src/multimarket_model.py src/multimarket_audit.py src/model_research.py
      - run: node tests/test_dashboard.js
