name: Selection policy tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'auditor/current_audit.py'
      - '.github/workflows/policy_tests.yml'
      - 'web/gold-dashboard-live.html'
      - 'web/index.html'
      - 'web/homepage.js'
      - 'web/results.js'
      - 'web/live-scores.js'
      - 'workers/live-scores/**'
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'auditor/current_audit.py', 'web/gold-dashboard-live.html', 'web/live-scores.js', 'web/index.html', 'web/homepage.js', 'web/results.js', '.github/workflows/policy_tests.yml', 'workers/live-scores/**']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile src/3appdays.py src/policy_integration.py src/selection_policy.py src/prematch_audit.py src/first_half_quality.py src/filter_audit.py src/multimarket_model.py src/context_analysis.py src/analysis_history.py src/multimarket_audit.py src/model_research.py src/signal_research.py auditor/current_audit.py
      - name: Check public homepage and verified results
        run: |
          node tests/test_homepage.js
          node tests/test_results.js
      - run: node tests/test_dashboard.js
      - run: node tests/test_gold_display.cjs
      - run: node tests/test_storage_loader.cjs
      - run: node --test tests/test_live_scores.mjs


      - name: Install browser for dashboard checks
        run: |
          npm install --prefix /tmp/arabsniper-browser playwright@1.62.1
          /tmp/arabsniper-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Check dashboard in desktop and mobile browser
        run: NODE_PATH=/tmp/arabsniper-browser/node_modules node tests/browser_dashboard.cjs
      - name: Save dashboard previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-dashboard-previews
          path: test-artifacts/
          if-no-files-found: ignore
