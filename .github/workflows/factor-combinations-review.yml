name: V7 factor combinations (read only)
on:
  pull_request:
    paths:
      - 'scripts/factor-combinations-review.py'
      - '.github/workflows/factor-combinations-review.yml'
permissions:
  contents: read
jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/factor-combinations-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install boto3 requests ijson==3.6.0
      - name: Compare frozen historical factors without changing selections
        env:
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python scripts/factor-combinations-review.py
      - uses: actions/upload-artifact@v4
        with:
          name: factor-combinations-review
          path: test-artifacts/factor-combinations-review.json
          retention-days: 30
          if-no-files-found: error
