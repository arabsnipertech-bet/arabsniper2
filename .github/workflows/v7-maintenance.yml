name: ArabSniper V7 maintenance

on:
  schedule:
    - cron: '1 0 * * *'
      timezone: 'Europe/Rome'
    - cron: '30 12-22 * * *'
      timezone: 'Europe/Rome'

permissions:
  contents: read

concurrency:
  group: arabsniper-quote-data-writer
  cancel-in-progress: false
  queue: max

jobs:
  maintenance:
    if: github.repository == 'arabsnipertech-bet/arabsniper2' && github.ref == 'refs/heads/main' && vars.GOLD_PRIVATE == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    env:
      GOLD_PRIVATE: 'true'
      R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
      R2_BUCKET: arabsniper-gold
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
      ARAB_V7_PRICE_BUDGET: ${{ vars.ARAB_V7_PRICE_BUDGET || '65' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install boto3 requests ijson==3.6.0
      - name: Consolidate yesterday pending Auditor
        if: github.event.schedule == '1 0 * * *'
        run: python src/v7_maintenance.py consolidate
      - name: Refresh and checkpoint complete prices for imminent fixtures
        if: github.event.schedule == '30 12-22 * * *'
        run: python src/v7_maintenance.py prices
