name: Correct morning Gold analysis
on:
  push:
    branches: [main]
    paths: ['.github/workflows/telegram-morning-correction.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: telegram-prediction-publication
  cancel-in-progress: false
jobs:
  correction:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow==11.3.0 requests==2.32.5 boto3
      - id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python src/telegram_analysis_correction.py
      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.name != ''
        with:
          name: ${{ steps.prepare.outputs.name }}-claim
          path: post.json
          retention-days: 3
      - name: Publish verified morning analysis
        if: steps.prepare.outputs.name != ''
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python src/telegram_digest.py send
      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.name != ''
        with:
          name: ${{ steps.prepare.outputs.name }}-sent
          path: |
            post.json
            social-card.jpg
          retention-days: 3
