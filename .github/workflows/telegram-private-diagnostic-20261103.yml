name: One-time Telegram private selection diagnostic Nov 3
# Recheck after cached_stable compatibility fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/telegram-private-diagnostic-20261103.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install boto3
      - name: Diagnose R2 Gold board eligibility without posting
        env:
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python3 - <<'PY'
          import json,sys,collections
          from datetime import datetime,timedelta
          from zoneinfo import ZoneInfo
          sys.path.insert(0,"src")
          from gold_storage import client
          from telegram_private_feed import from_private_day,stamp,goal_market
          now=datetime.now(ZoneInfo("Europe/Rome"))
          s3=client()
          raw=s3.get_object(Bucket="arabsniper-gold",Key="arab_quote_day1.json")["Body"].read()
          day=json.loads(raw)
          print("BOARD_DATE",day.get("date"),"UPDATED",day.get("updated_at"),"MATCHES",len(day.get("matches",[])),"BYTES",len(raw),flush=True)
          choices=from_private_day(day,now)
          print("TELEGRAM_ELIGIBLE",len(choices))
          status=collections.Counter()
          examples=[]
          all_eligible=0
          for match in day.get("matches",[]):
            f=match.get("fixture") or {}
            start=stamp(f.get("kickoff"))
            if not start or not now<start or start.astimezone(ZoneInfo("Europe/Rome")).date()!=now.date():continue
            mm=match.get("multimarket") or {}
            matrix=mm.get("matrix") or {}
            rows=matrix.get("rows") or []
            gold=matrix.get("opportunity_policy") or {}
            plat=matrix.get("platinum_policy") or {}
            best_ids={"gold":gold.get("best_market_id"),"platinum":plat.get("best_market_id")}
            elig=[]
            reasons=[]
            for row in rows:
              tier=row.get("opportunity") or {}
              p=row.get("platinum") or {}
              if tier.get("eligible") or p.get("eligible"):
                all_eligible+=1
                elig.append({"id":str(row.get("id"))[:90],"odd":row.get("odd"),"goal_market":goal_market(row),"provider_at":row.get("provider_updated_at"),"quote_status":row.get("quote_status"),"quote_executable":row.get("quote_executable"),"oci":row.get("oci"),"market":str(row.get("label"))[:45],"gold_eligible":tier.get("eligible"),"platinum_eligible":p.get("eligible"),"is_gold_best":row.get("id")==best_ids["gold"],"is_platinum_best":row.get("id")==best_ids["platinum"]})
            if elig:
              status["fixtures_with_eligible_rows"]+=1
              scope=match.get("gold_scope") or {}
              if scope.get("allowed") is not True:status["scope_blocked"]+=1
              if f.get("status_short") not in ("NS","TBD"):status["status_blocked"]+=1
              if not mm.get("captured_at"):status["no_capture"]+=1
              if f.get("result"):status["result_present"]+=1
              if len(examples)<15:
                examples.append({"fixture_id":f.get("fixture_id"),"name":f.get("match"),"kickoff":f.get("kickoff"),"status":f.get("status_short"),"allowed":scope.get("allowed"),"captured":mm.get("captured_at"),"best":best_ids,"rows":elig[:4]})
          print("FUTURE_ROWS_ELIGIBLE",all_eligible,"COUNTS",dict(status))
          for example in examples:print("ROW",json.dumps(example,ensure_ascii=False))
          PY
