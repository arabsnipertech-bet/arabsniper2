name: Telegram daily picks and scores
on:
  push:
    branches: [main]
    paths: ['.github/workflows/telegram-digest.yml', 'src/telegram_digest.py', 'src/telegram_private_feed.py']
  workflow_dispatch:
    inputs:
      recovery_slot:
        description: 'Guarded external backup slot; no manual forced picks'
        required: false
        type: string
  # UTC cron, CET/CEST primary and 13-minute fallback; script gates by Rome local time.
  schedule:
    - cron: '0 11 * * *'
    - cron: '13 11 * * *'
    - cron: '0 12 * * *'
    - cron: '13 12 * * *'
    - cron: '30 15 * * *'
    - cron: '43 15 * * *'
    - cron: '30 16 * * *'
    - cron: '43 16 * * *'
    - cron: '0 17 * * *'
    - cron: '13 17 * * *'
    - cron: '0 18 * * *'
    - cron: '13 18 * * *'
    - cron: '0 19 * * *'
    - cron: '13 19 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: telegram-channel-publication
  cancel-in-progress: false
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Telegram selection and score tests
        run: python3 -m unittest discover -s tests -p test_telegram_digest.py -v
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow==11.3.0 requests==2.32.5 boto3
      - id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          RECOVERY_SLOT: ${{ inputs.recovery_slot }}
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python3 src/telegram_digest.py prepare
      - name: Render selected prediction as a graphical card
        if: steps.prepare.outputs.name != ''
        run: python3 src/telegram_card.py post.json telegram-card.png
      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.name != ''
        with:
          name: ${{ steps.prepare.outputs.name }}-claim
          path: post.json
          retention-days: 3
          if-no-files-found: error
      - name: Send to the channel
        if: steps.prepare.outputs.name != ''
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 src/telegram_digest.py send
      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.name != ''
        with:
          name: ${{ steps.prepare.outputs.name }}-sent
          path: post.json
          retention-days: 3
