name: Telegram daily picks and scores
on:
  push:
    branches: [main]
    paths: ['.github/workflows/telegram-digest.yml', 'src/telegram_digest.py', 'src/telegram_slots.py', 'src/telegram_watchdog.py']
  workflow_dispatch:
    inputs:
      recovery_slot:
        description: 'Guarded external backup slot; no manual forced picks'
        required: false
        type: string
  schedule:
    - cron: '30 22,23,2,3,8,9,10,11,15,16,17 * * *'
    - cron: '0 18,19,20,21 * * *'
    - cron: '45 10,11,14,15 * * *'
    - cron: '15 15,16 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: telegram-prediction-publication
  cancel-in-progress: false
jobs:
  digest:
    outputs:
      slot_artifact: ${{ steps.prepare.outputs.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Telegram selection and score tests
        run: |
          python3 -m unittest discover -s tests -p test_telegram_digest.py -v
          python3 -m unittest discover -s tests -p test_social_reserved.py -v
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow==11.3.0 requests==2.32.5 boto3
      - name: Verify current Gold source and channel posting rights on deployment
        if: github.event_name == 'push'
        env:
          PYTHONPATH: src
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python - <<'PYTHON'
          import json, os
          from datetime import datetime
          from gold_storage import client
          from telegram_digest import ROME, CHANNEL, slot_message
          from telegram_gold_promo import telegram
          from telegram_slots import CHANNEL_SLOTS, EDITORIAL, WINDOWS
          from homepage_preview import social_board
          now = datetime.now(ROME)
          obj = client().get_object(Bucket=os.environ['R2_BUCKET'], Key='arab_quote_day1.json')
          board = json.load(obj['Body'])
          assert board.get('date') == now.date().isoformat() and board.get('matches')
          social_board(board, now, blue_only=True)
          token = os.environ['BOT_TOKEN']
          bot = telegram('getMe', token)
          chat = telegram('getChat', token, chat_id=CHANNEL)
          admin = telegram('getChatMember', token, chat_id=chat['id'], user_id=bot['id'])
          assert bot['username'].lower() == 'arabsniperbot' and chat['username'].lower() == CHANNEL[1:]
          assert admin.get('can_post_messages')
          for slot in CHANNEL_SLOTS:
              first,last,_ = WINDOWS.get(slot, ('','',0))
              assert slot_message(dict(slot=slot,picks=[],first=first,last=last,day=board['date']))
          print('Channel posting rights and private Gold source verified for all configured slots')
          PYTHON
      - id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          RECOVERY_SLOT: ${{ inputs.recovery_slot }}
          R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
          R2_BUCKET: arabsniper-gold
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python3 src/telegram_digest.py prepare
      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.name != ''
        with:
          name: ${{ steps.prepare.outputs.name }}-claim
          path: post.json
          retention-days: 3
          if-no-files-found: error
      - name: Send to the channel
        if: steps.prepare.outputs.name != ''
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 src/telegram_digest.py send
      - uses: actions/upload-artifact@v4
        if: steps.prepare.outputs.name != ''
        with:
          name: ${{ steps.prepare.outputs.name }}-sent
          path: |
            post.json
            social-card.jpg
          retention-days: 3

  facebook:
    needs: digest
    if: needs.digest.outputs.slot_artifact != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: facebook-page-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow==11.3.0 requests==2.32.5
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.digest.outputs.slot_artifact }}-sent
          path: receipts
      - name: Publish this confirmed slot directly via Meta
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: python src/facebook_page.py selections
