name: ArabSniper Fast Scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/3appdays.py'
      - 'src/policy_integration.py'
      - 'src/first_half_quality.py'
      - 'src/multimarket_model.py'
      - 'src/multimarket_audit.py'
      - 'src/signal_research.py'
      - 'src/model_research.py'
      - 'src/context_analysis.py'
      - 'src/statistics_coverage.py'
      - 'src/analysis_history.py'
      - 'src/3appdays_runner.py'
      - 'src/selection_policy.py'
      - 'src/homepage_preview.py'
  schedule:
    # Avoid the busiest top-of-hour scheduling window on GitHub Actions.
    - cron: "17 6-23 * * *"
      timezone: "Europe/Rome"

permissions:
  contents: write

# Stesso gruppo del Night Scan: mai due writer sui JSON contemporaneamente.
concurrency:
  group: arabsniper-quote-data-writer
  cancel-in-progress: false

jobs:
  fast-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    env:
      GOLD_PRIVATE: ${{ vars.GOLD_PRIVATE }}
      R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
      R2_BUCKET: arabsniper-gold
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      PYTHONUNBUFFERED: '1'
      API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
      # Bounded incremental recovery; completed historical statistics are reused.
      ARAB_XG_MAX_CALLS_PER_RUN: ${{ vars.ARAB_FAST_STATS_BUDGET || '250' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests PyGithub

      - name: Prepare private storage client
        if: vars.GOLD_STORAGE_ENABLED == 'true' || vars.GOLD_PRIVATE == 'true'
        run: pip install boto3

      - name: Restore authoritative private checkpoint
        if: vars.GOLD_PRIVATE == 'true'
        run: python src/gold_storage.py restore

      - name: Create market catalog if missing
        run: |
          if [ ! -f data/arab_bet_catalog.json ]; then
            python src/3appdays_runner.py --catalog
          else
            echo "Catalogo mercati già presente"
          fi

      - name: Run Fast Scan
        run: python src/3appdays_runner.py --fast

      - name: Compare fixed models on archived inputs
        run: python src/model_research.py

      - name: Publish live fixture identifiers and usage counters
        run: |
          python src/live_watchlist.py
          python src/scan_usage.py

      - name: Pack and verify publication size
        run: python src/publication_storage.py

      - name: Validate generated files
        run: |
          echo "File ArabSniper prodotti:"
          ls -lh data/arab_quote_*.json
          test -f data/arab_quote_dashboard.json
          test -f data/arab_quote_state.json
          test -f data/arab_quote_day1.json
          test -f data/arab_quote_day2.json

      - name: Save verified state in private storage
        if: vars.GOLD_STORAGE_ENABLED == 'true' || vars.GOLD_PRIVATE == 'true'
        run: python src/gold_storage.py publish

      - name: Publish only public projections
        if: vars.GOLD_PRIVATE == 'true'
        run: python src/private_publication.py

      - name: Publish Fast Scan safely
        if: vars.GOLD_PRIVATE != 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/arabsniper-publish
          mkdir -p /tmp/arabsniper-publish
          cp data/arab_quote_*.json /tmp/arabsniper-publish/
          cp data/live_watchlist.json /tmp/arabsniper-publish/
          if [ -d data/_audit_parts ]; then cp -a data/_audit_parts /tmp/arabsniper-publish/; fi
          if [ -f data/arab_bet_catalog.json ]; then
            cp data/arab_bet_catalog.json /tmp/arabsniper-publish/
          fi

          publish_attempt() {
            git fetch origin main
            git reset --hard origin/main

            mkdir -p data
            cp /tmp/arabsniper-publish/arab_quote_*.json data/
            cp /tmp/arabsniper-publish/live_watchlist.json data/
            if [ -d /tmp/arabsniper-publish/_audit_parts ]; then cp -a /tmp/arabsniper-publish/_audit_parts data/; fi
            if [ -f /tmp/arabsniper-publish/arab_bet_catalog.json ]; then
              cp /tmp/arabsniper-publish/arab_bet_catalog.json data/
            fi

            git add data/arab_quote_*.json data/live_watchlist.json
            if [ -d data/_audit_parts ]; then git add data/_audit_parts; fi
            if [ -f data/arab_bet_catalog.json ]; then
              git add data/arab_bet_catalog.json
            fi

            if git diff --cached --quiet; then
              echo "Nessuna variazione da pubblicare"
              return 0
            fi

            git commit -m "Update ArabSniper fast quote data"
            git push origin HEAD:main
          }

          for attempt in 1 2 3; do
            echo "Tentativo pubblicazione $attempt/3"
            if publish_attempt; then
              echo "Pubblicazione Fast Scan completata"
              exit 0
            fi
            echo "Push concorrente rilevato: risincronizzo con main"
            sleep $((attempt * 2))
          done

          echo "Errore: impossibile pubblicare dopo 3 tentativi"
          exit 1

      - name: Preserve generated data if publication fails
        if: failure() && vars.GOLD_PRIVATE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scan-recovery-${{ github.run_id }}
          retention-days: 14
          path: |
            data/arab_quote_*.json
            data/_audit_parts/


