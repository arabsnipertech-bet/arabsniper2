name: ArabSniper Fast Scan

on:
  workflow_dispatch:
    inputs:
      force_fast:
        description: 'Ripeti un Fast recente (solo recupero manuale esplicito)'
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - 'src/audit_storage.py'
      - 'src/audit_ledger.py'
      - 'src/scan_audit.py'
      - 'src/3appdays.py'
      - 'src/policy_integration.py'
      - 'src/lateral_matrix.py'
      - 'src/matrix_quotes.py'
      - 'src/matrix_pipeline.py'
      - 'src/matrix_audit.py'
      - 'src/statistics_first.py'
      - 'src/statistics_integration.py'
      - 'src/first_half_quality.py'
      - 'src/multimarket_model.py'
      - 'src/multimarket_audit.py'
      - 'src/signal_research.py'
      - 'src/model_research.py'
      - 'src/context_analysis.py'
      - 'src/statistics_coverage.py'
      - 'src/analysis_history.py'
      - 'src/3appdays_runner.py'
      - 'src/selection_policy.py'
      - 'src/homepage_preview.py'
      - 'src/opportunity_policy.py'
      - 'src/platinum_policy.py'
      - 'src/platinum_audit.py'
      - 'src/refresh_opportunities.py'
      - 'src/gold_competitions.py'
      - 'src/gold_policy_audit.py'
      - 'src/market_scope.py'
      - 'src/proposal_stability.py'
  schedule:
    - cron: "0 6-23 * * *"
      timezone: "Europe/Rome"

permissions:
  contents: write

# Stesso gruppo del Night Scan: mai due writer sui JSON contemporaneamente.
concurrency:
  group: arabsniper-quote-data-writer
  cancel-in-progress: false

jobs:
  fast-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    env:
      GOLD_PRIVATE: ${{ vars.GOLD_PRIVATE }}
      R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
      R2_BUCKET: arabsniper-gold
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      PYTHONUNBUFFERED: '1'
      ARAB_FORCE_FAST: ${{ inputs.force_fast && 'true' || 'false' }}
      API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
      # Bounded incremental recovery; completed historical statistics are reused.
      ARAB_XG_MAX_CALLS_PER_RUN: ${{ vars.ARAB_FAST_STATS_BUDGET || '250' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests PyGithub ijson==3.6.0

      - name: Prepare private storage client
        if: vars.GOLD_STORAGE_ENABLED == 'true' || vars.GOLD_PRIVATE == 'true'
        run: pip install boto3 ijson==3.6.0

      - name: Restore authoritative private checkpoint
        if: vars.GOLD_PRIVATE == 'true'
        run: python src/gold_storage.py restore

      - name: Check completed Fast Scan before collecting again
        id: fast_guard
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python src/fast_scan_guard.py

      - name: Select cached refresh for price-only releases
        if: steps.fast_guard.outputs.run == 'true'
        id: refresh
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mode=full
          if [ "$EVENT_NAME" = push ]; then
            mode=$(git diff-tree --no-commit-id --name-only -r HEAD | python src/refresh_opportunities.py --classify-push)
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Refresh mode: $mode"

      - name: Create market catalog if missing
        if: steps.fast_guard.outputs.run == 'true' && steps.refresh.outputs.mode != 'cached'
        run: |
          if [ ! -f data/arab_bet_catalog.json ]; then
            python src/3appdays_runner.py --catalog
          else
            echo "Catalogo mercati già presente"
          fi

      - name: Run Fast Scan
        if: steps.fast_guard.outputs.run == 'true' && steps.refresh.outputs.mode != 'cached'
        run: python src/3appdays_runner.py --fast

      # A full Fast scan recollects only days 1-2. Migrate saved days 3-5 too,
      # or a model/policy release leaves the later tabs on the previous policy.
      - name: Refresh all five saved days to the active Gold policy (zero API calls)
        if: steps.fast_guard.outputs.run == 'true'
        run: python src/refresh_opportunities.py

      - name: Preserve legacy model comparison archive
        if: steps.fast_guard.outputs.run == 'true'
        # Historical comparisons are rebuilt only by the 00:30 Auditor.
        # The 18 October reconstruction remains an archive, not an hourly task.
        run: test -f data/arab_quote_model_research.json

      - name: Publish live fixture identifiers and usage counters
        if: steps.fast_guard.outputs.run == 'true'
        env:
          REFRESH_MODE: ${{ steps.refresh.outputs.mode }}
        run: |
          python src/live_watchlist.py
          if [ "$REFRESH_MODE" != cached ]; then python src/scan_usage.py; fi

      - name: Freeze current decisions and verify scan publication
        if: steps.fast_guard.outputs.run == 'true'
        # Gold decisions and both shadow variants are frozen before publication.
        run: |
          python src/audit_journal.py capture
          python src/publication_storage.py --scan-only

      - name: Refresh public results for the active model
        if: steps.fast_guard.outputs.run == 'true'
        run: python src/homepage_results.py

      - name: Validate generated files
        if: steps.fast_guard.outputs.run == 'true'
        run: |
          echo "File ArabSniper prodotti:"
          ls -lh data/arab_quote_*.json
          test -f data/arab_quote_dashboard.json
          test -f data/arab_quote_state.json
          test -f data/arab_quote_day1.json
          test -f data/arab_quote_day2.json

      - name: Record verified Fast completion
        if: steps.fast_guard.outputs.run == 'true' && steps.refresh.outputs.mode != 'cached'
        env:
          FAST_REQUESTED_AT: ${{ steps.fast_guard.outputs.started_at }}
        run: python src/fast_scan_guard.py --record

      - name: Save verified state in private storage
        if: steps.fast_guard.outputs.run == 'true' && (vars.GOLD_STORAGE_ENABLED == 'true' || vars.GOLD_PRIVATE == 'true')
        run: python src/gold_storage.py publish

      - name: Publish only public projections
        if: steps.fast_guard.outputs.run == 'true' && vars.GOLD_PRIVATE == 'true'
        run: python src/private_publication.py

      - name: Publish Fast Scan safely
        if: steps.fast_guard.outputs.run == 'true' && vars.GOLD_PRIVATE != 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/arabsniper-publish
          mkdir -p /tmp/arabsniper-publish
          cp data/arab_quote_*.json /tmp/arabsniper-publish/
          cp data/live_watchlist.json /tmp/arabsniper-publish/
          if [ -d data/_audit_parts ]; then cp -a data/_audit_parts /tmp/arabsniper-publish/; fi
          if [ -f data/arab_bet_catalog.json ]; then
            cp data/arab_bet_catalog.json /tmp/arabsniper-publish/
          fi

          publish_attempt() {
            git fetch origin main
            git reset --hard origin/main

            mkdir -p data
            cp /tmp/arabsniper-publish/arab_quote_*.json data/
            cp /tmp/arabsniper-publish/live_watchlist.json data/
            if [ -d /tmp/arabsniper-publish/_audit_parts ]; then cp -a /tmp/arabsniper-publish/_audit_parts data/; fi
            if [ -f /tmp/arabsniper-publish/arab_bet_catalog.json ]; then
              cp /tmp/arabsniper-publish/arab_bet_catalog.json data/
            fi

            git add data/arab_quote_*.json data/live_watchlist.json
            if [ -d data/_audit_parts ]; then git add data/_audit_parts; fi
            if [ -f data/arab_bet_catalog.json ]; then
              git add data/arab_bet_catalog.json
            fi

            if git diff --cached --quiet; then
              echo "Nessuna variazione da pubblicare"
              return 0
            fi

            git commit -m "Update ArabSniper fast quote data"
            git push origin HEAD:main
          }

          for attempt in 1 2 3; do
            echo "Tentativo pubblicazione $attempt/3"
            if publish_attempt; then
              echo "Pubblicazione Fast Scan completata"
              exit 0
            fi
            echo "Push concorrente rilevato: risincronizzo con main"
            sleep $((attempt * 2))
          done

          echo "Errore: impossibile pubblicare dopo 3 tentativi"
          exit 1

      - name: Preserve generated data if publication fails
        if: steps.fast_guard.outputs.run == 'true' && failure() && vars.GOLD_PRIVATE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scan-recovery-${{ github.run_id }}
          retention-days: 14
          path: |
            data/arab_quote_*.json
            data/_audit_parts/




