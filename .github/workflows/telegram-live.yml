name: Publisher Telegram Live Events
on:
  workflow_dispatch:
    inputs:
      fixture_id:
        description: 'Identificativo della partita già annunciata'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: arabsniper-telegram-live
  cancel-in-progress: false
jobs:
  live:
    if: >-
      github.repository == 'arabsnipertech-bet/arabsniper2' &&
      github.ref == 'refs/heads/main' && vars.PUBLISHER_V71_DISABLED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 215
    env:
      PYTHONPATH: src
      LIVE_FIXTURE_ID: ${{ inputs.fixture_id }}
      PUBLISHER_DISABLED: ${{ vars.PUBLISHER_V71_DISABLED }}
      BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      FACEBOOK_ENABLED: ${{ vars.PUBLISHER_V71_FACEBOOK_DISABLED != 'true' }}
      META_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
      R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
      R2_BUCKET: arabsniper-gold
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'boto3>=1.42,<2' 'requests>=2.32,<3' 'Pillow>=11,<13' ijson==3.6.0
      - name: Monitor the announced fixture and update the original post
        run: python -u -m publisher_v71.monitor
