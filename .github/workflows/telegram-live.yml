name: Telegram one daily live
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/telegram_live.py', 'src/telegram_live_art.py', 'tests/test_telegram_live.py', '.github/workflows/telegram-live.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: arabsniper-telegram-live
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      GH_TOKEN: ${{ github.token }}
      BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
      R2_ACCOUNT_ID: dfdb02b4139b31c0ab4456a50eb371a2
      R2_BUCKET: arabsniper-gold
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install boto3 requests Pillow==11.3.0
      - name: Test live policy and event handling
        run: python -m unittest discover -s tests -p test_telegram_live.py -v
      - name: Render animation loops
        run: python src/telegram_live_art.py
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: telegram-live-animations
          path: assets/telegram-live/*.gif
          retention-days: 30
      - name: Verify bot and private state access
        run: python src/telegram_live.py check
      - name: Monitor one published fixture with persistent recovery
        if: github.event_name == 'workflow_dispatch'
        run: python -u src/telegram_live.py monitor
