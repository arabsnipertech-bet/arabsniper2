name: One-time Telegram trial webhook connectivity 2026-11-03
on:
  push:
    branches: [main]
    paths: ['.github/workflows/telegram-trial-webhook-check-once.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect webhook and Gold trial endpoint without accessing user data
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError,URLError
          from urllib.parse import urlparse
          token=os.environ.get("TELEGRAM_BOT_TOKEN")
          if not token:raise SystemExit("bot token not configured")
          with urlopen("https://api.telegram.org/bot"+token+"/getWebhookInfo",timeout=15) as response:
              r=json.load(response)
          info=r.get("result") or {}
          endpoint=str(info.get("url") or "")
          parsed=urlparse(endpoint) if endpoint else None
          print("WEBHOOK_CONFIGURED",bool(endpoint))
          print("WEBHOOK_HOST",parsed.hostname if parsed else "(none)")
          print("WEBHOOK_PATH",parsed.path if parsed else "(none)")
          print("WEBHOOK_PENDING_UPDATES",info.get("pending_update_count"))
          print("WEBHOOK_LAST_ERROR",bool(info.get("last_error_date")))
          print("WEBHOOK_ALLOWED_UPDATES",info.get("allowed_updates"))
          print("WEBHOOK_LAST_ERROR_TIMESTAMP",info.get("last_error_date"))
          print("WEBHOOK_LAST_ERROR_DESCRIPTION",str(info.get("last_error_message") or "")[:180])
          for url in ("https://arabsniperbet.com/api/telegram-webhook","https://stripe-checker.arabsnipertech.workers.dev/api/telegram-webhook"):
              try:
                  req=Request(url,data=b'{}',headers={
                    "Content-Type":"application/json",
                    "X-Telegram-Bot-Api-Secret-Token":"intentionally-invalid-probe"},method="POST")
                  with urlopen(req,timeout=15) as response:
                      print("TRIAL_ENDPOINT_HTTP",urlparse(url).hostname,response.status)
              except HTTPError as e:
                  print("TRIAL_ENDPOINT_HTTP",urlparse(url).hostname,e.code)
              except URLError as e:
                  print("TRIAL_ENDPOINT_UNREACHABLE",type(e.reason).__name__)
          PY
